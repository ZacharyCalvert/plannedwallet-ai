<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Planned Wallet Icon">
  <defs>
    <!-- App Slate Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Cognac / Saddle Brown Leather -->
    <linearGradient id="walletBodyGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#b4693e" />
      <stop offset="55%" stop-color="#8b4a26" />
      <stop offset="100%" stop-color="#6b361a" />
    </linearGradient>

    <linearGradient id="walletFlapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c97a4b" />
      <stop offset="100%" stop-color="#9a532c" />
    </linearGradient>

    <linearGradient id="claspGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a85d34" />
      <stop offset="100%" stop-color="#783b1c" />
    </linearGradient>

    <!-- Financial Trend Gradient -->
    <linearGradient id="trendLineGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="trendAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Container -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Subtle Glow Behind Graph -->
  <circle cx="76" cy="40" r="30" fill="#2563eb" opacity="0.16" />

  <!-- Rising Financial Trend Area & Bars -->
  <rect x="34" y="42" width="10" height="18" rx="2" fill="#2563eb" opacity="0.55" />
  <rect x="50" y="34" width="10" height="26" rx="2" fill="#3b82f6" opacity="0.7" />
  <rect x="66" y="25" width="10" height="35" rx="2" fill="#10b981" opacity="0.85" />

  <!-- Trend Line + Arrow -->
  <path d="M 28 48 L 46 38 L 62 42 L 88 20" fill="none" stroke="url(#trendLineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 78 20 L 89 19 L 87 30" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brown Leather Wallet Back Edge -->
  <rect x="24" y="48" width="76" height="52" rx="11" fill="#5c2d14" />

  <!-- Main Brown Leather Wallet Body -->
  <rect x="22" y="53" width="80" height="52" rx="11" fill="url(#walletBodyGrad)" stroke="#d48c62" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Top Leather Flap Accent -->
  <path d="M 22 64 C 22 57.9 26.9 53 33 53 L 91 53 C 97.1 53 102 57.9 102 64 L 102 66 L 22 66 Z" fill="url(#walletFlapGrad)" opacity="0.85" />

  <!-- Subtle Leather Stitching -->
  <rect x="27" y="58" width="70" height="42" rx="8" fill="none" stroke="#fde68a" stroke-opacity="0.38" stroke-width="1.4" stroke-dasharray="3.5 3.5" />

  <!-- Wallet Clasp / Strap -->
  <rect x="76" y="70" width="30" height="20" rx="6" fill="url(#claspGrad)" stroke="#d48c62" stroke-opacity="0.45" stroke-width="1.4" />
  <circle cx="86" cy="80" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1" />
</svg>
