name: Destroy Stage Data

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy-stage-data:
    name: Purge Users and Accounts (Stage Only)
    if: github.actor == 'ZacharyCalvert'
    runs-on: ubuntu-latest
    environment: stage
    concurrency:
      group: deployment-stage
      cancel-in-progress: false

    steps:
      - name: Enforce operator authorization (ZacharyCalvert only)
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != "ZacharyCalvert" ]; then
            echo "::error::Access Denied: Only user 'ZacharyCalvert' is authorized to execute this stage data destruction workflow. Execution by '$ACTOR' rejected."
            exit 1
          fi
          echo "Authorization confirmed for operator: ZacharyCalvert."

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Execute Stage Data Destruction SQL via ECS Fargate RunTask
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_MIGRATION_TASK_DEFINITION: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
          MIGRATION_SUBNETS: ${{ vars.MIGRATION_SUBNETS }}
          MIGRATION_SG: ${{ vars.MIGRATION_SG }}
        run: |
          python3 .github/scripts/run_ecs_sql.py \
            --sql-file .github/scripts/destroy-stage.sql \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${ECS_MIGRATION_TASK_DEFINITION}" \
            --subnets "${MIGRATION_SUBNETS}" \
            --security-group "${MIGRATION_SG}"
