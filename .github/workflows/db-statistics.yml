name: Database Statistics
run-name: "Database Statistics [${{ inputs.environment || 'stage' }}] (${{ github.event_name }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to inspect'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  db-statistics:
    name: Inspect Database Statistics (${{ inputs.environment }})
    if: github.actor == 'ZacharyCalvert'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deployment-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Enforce operator authorization (ZacharyCalvert only)
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != "ZacharyCalvert" ]; then
            echo "::error::Access Denied: Only user 'ZacharyCalvert' is authorized to inspect database statistics. Execution by '$ACTOR' rejected."
            exit 1
          fi
          echo "Authorization confirmed for operator: ZacharyCalvert."

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate target environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          echo "Selected Target Environment: $TARGET_ENV"
          if [ "$TARGET_ENV" != "stage" ] && [ "$TARGET_ENV" != "prod" ]; then
            echo "::error::Invalid target environment '$TARGET_ENV'. Must be stage or prod."
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Execute Read-Only Statistics Query via ECS Fargate RunTask
        env:
          TARGET_ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_MIGRATION_TASK_DEFINITION: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
          MIGRATION_SUBNETS: ${{ vars.MIGRATION_SUBNETS }}
          MIGRATION_SG: ${{ vars.MIGRATION_SG }}
        run: |
          python3 .github/scripts/run_ecs_sql.py \
            --sql-file .github/scripts/db-statistics.sql \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${ECS_MIGRATION_TASK_DEFINITION}" \
            --subnets "${MIGRATION_SUBNETS}" \
            --security-group "${MIGRATION_SG}" \
            --summary-title "Database Statistics: ${TARGET_ENV}"
