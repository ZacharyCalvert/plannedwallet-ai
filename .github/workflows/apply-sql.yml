name: Apply Database Migrations (Azure PostgreSQL)

on:
  push:
    branches:
      - main
    paths:
      - 'backend-api/internal/database/init.sql'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - production

permissions:
  id-token: write
  contents: read

jobs:
  apply-sql:
    name: Apply SQL to ${{ inputs.environment || 'stage' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'stage' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate target environment
        env:
          TARGET_ENV: ${{ inputs.environment || 'stage' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Triggered by event: $EVENT_NAME"
          echo "Target Environment: $TARGET_ENV"
          if [ "$EVENT_NAME" = "push" ] && [ "$TARGET_ENV" != "stage" ]; then
            echo "Error: Automated push triggers are strictly restricted to the stage environment."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Azure Login via OIDC Federated Trust
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Database Credentials & Dynamic Firewall
        id: db-setup
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          POSTGRES_SERVER_NAME: ${{ vars.POSTGRES_SERVER_NAME || secrets.POSTGRES_SERVER_NAME }}
          INPUT_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # 1. Determine whether to use Microsoft Entra ID token or configured password
          if [ -n "$INPUT_POSTGRES_PASSWORD" ]; then
            echo "Using configured POSTGRES_PASSWORD secret."
            echo "::add-mask::$INPUT_POSTGRES_PASSWORD"
            echo "pg_password=$INPUT_POSTGRES_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            echo "Acquiring Microsoft Entra ID access token for Azure PostgreSQL Flexible Server..."
            TOKEN=$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)
            echo "::add-mask::$TOKEN"
            echo "pg_password=$TOKEN" >> "$GITHUB_OUTPUT"
          fi

          # 2. Add temporary runner IP to firewall if resource group and server name are specified
          if [ -n "$AZURE_RESOURCE_GROUP" ] && [ -n "$POSTGRES_SERVER_NAME" ]; then
            RUNNER_IP=$(curl -s https://api.ipify.org)
            RULE_NAME="gh-actions-${RUN_ID}-${RUN_ATTEMPT}"
            echo "Adding temporary firewall rule '$RULE_NAME' for runner IP $RUNNER_IP..."
            az postgres flexible-server firewall-rule create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$POSTGRES_SERVER_NAME" \
              --rule-name "$RULE_NAME" \
              --start-ip-address "$RUNNER_IP" \
              --end-ip-address "$RUNNER_IP" \
              --output none
            echo "rule_name=$RULE_NAME" >> "$GITHUB_OUTPUT"
            echo "rule_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "AZURE_RESOURCE_GROUP or POSTGRES_SERVER_NAME not provided; skipping dynamic firewall rule creation."
            echo "rule_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply SQL Schema to Azure PostgreSQL
        env:
          PGHOST: ${{ vars.POSTGRES_HOST || secrets.POSTGRES_HOST }}
          PGPORT: ${{ vars.POSTGRES_PORT || secrets.POSTGRES_PORT || '5432' }}
          PGDATABASE: ${{ vars.POSTGRES_DB || secrets.POSTGRES_DB || 'plannedwallet' }}
          PGUSER: ${{ vars.POSTGRES_USER || secrets.POSTGRES_USER }}
          PGPASSWORD: ${{ steps.db-setup.outputs.pg_password }}
          PGSSLMODE: ${{ vars.POSTGRES_SSLMODE || 'require' }}
        run: |
          if [ -z "$PGHOST" ] || [ -z "$PGUSER" ]; then
            echo "Error: Missing PGHOST or PGUSER. Configure environment variables in GitHub repository settings."
            exit 1
          fi

          echo "Applying init.sql to database '$PGDATABASE' on $PGHOST:$PGPORT (user: $PGUSER, sslmode: $PGSSLMODE)..."
          psql -v ON_ERROR_STOP=1 -f backend-api/internal/database/init.sql
          echo "Database schema migration completed successfully."

      - name: Cleanup Dynamic Firewall Rule
        if: always() && steps.db-setup.outputs.rule_created == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          POSTGRES_SERVER_NAME: ${{ vars.POSTGRES_SERVER_NAME || secrets.POSTGRES_SERVER_NAME }}
          RULE_NAME: ${{ steps.db-setup.outputs.rule_name }}
        run: |
          echo "Removing temporary firewall rule '$RULE_NAME'..."
          az postgres flexible-server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$POSTGRES_SERVER_NAME" \
            --rule-name "$RULE_NAME" \
            --yes \
            --output none || true
          echo "Temporary firewall rule removed."
