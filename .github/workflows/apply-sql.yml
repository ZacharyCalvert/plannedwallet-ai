name: Apply Database Migrations (AWS RDS PostgreSQL)
run-name: "Apply Database Migrations [${{ ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.environment == 'prod') && 'prod' || 'stage' }}] (${{ github.event_name }})"

on:
  push:
    branches:
      - main
    paths:
      - 'backend-api/internal/database/init.sql'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
  workflow_call:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: false
        default: 'stage'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply-sql:
    name: Apply SQL to AWS RDS (${{ inputs.environment || 'stage' }})
    if: github.actor == 'ZacharyCalvert'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'stage' }}
    concurrency:
      group: deployment-${{ inputs.environment || 'stage' }}
      cancel-in-progress: false

    steps:
      - name: Enforce operator authorization (ZacharyCalvert only)
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != "ZacharyCalvert" ]; then
            echo "::error::Access Denied: Only user 'ZacharyCalvert' is authorized to run database migrations. Execution by '$ACTOR' rejected."
            exit 1
          fi
          echo "Authorization confirmed for operator: ZacharyCalvert."

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate target environment and ref
        env:
          TARGET_ENV: ${{ inputs.environment || 'stage' }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          FULL_REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          echo "Triggered by event: $EVENT_NAME"
          echo "Triggered on ref: $FULL_REF ($BRANCH)"
          echo "Target Environment: $TARGET_ENV"
          if [[ "$FULL_REF" == refs/tags/* ]]; then
            git fetch origin main
            TAG_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
            if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
              echo "::error::Tag '$BRANCH' ($TAG_COMMIT) is NOT in 'main'. Tag deployments are strictly restricted to commits in main."
              exit 1
            fi
            echo "Verified tag '$BRANCH' ($TAG_COMMIT) is an ancestor of origin/main."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch authorized for actor 'ZacharyCalvert' on ref '$FULL_REF'."
          elif [ "$BRANCH" != "main" ]; then
            echo "::error::Automated or workflow_call migration is strictly restricted to 'main' (got '$FULL_REF')."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [[ "$FULL_REF" != refs/tags/* ]] && [ "$TARGET_ENV" != "stage" ]; then
            echo "Error: Automated branch push triggers are strictly restricted to the stage environment."
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Execute Schema Migration on RDS via ECS Fargate RunTask
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_MIGRATION_TASK_DEFINITION: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
          MIGRATION_SUBNETS: ${{ vars.MIGRATION_SUBNETS }}
          MIGRATION_SG: ${{ vars.MIGRATION_SG }}
        run: |
          python3 .github/scripts/run_ecs_sql.py \
            --sql-file backend-api/internal/database/init.sql \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${ECS_MIGRATION_TASK_DEFINITION}" \
            --subnets "${MIGRATION_SUBNETS}" \
            --security-group "${MIGRATION_SG}"
