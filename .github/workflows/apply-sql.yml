name: Apply Database Migrations (AWS RDS PostgreSQL)

on:
  push:
    branches:
      - main
    paths:
      - 'backend-api/internal/database/init.sql'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  apply-sql:
    name: Apply SQL to AWS RDS (${{ inputs.environment || 'stage' }})
    if: github.actor == 'ZacharyCalvert'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'stage' }}
    concurrency:
      group: deployment-${{ inputs.environment || 'stage' }}
      cancel-in-progress: false

    steps:
      - name: Enforce operator authorization (ZacharyCalvert only)
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != "ZacharyCalvert" ]; then
            echo "::error::Access Denied: Only user 'ZacharyCalvert' is authorized to run database migrations. Execution by '$ACTOR' rejected."
            exit 1
          fi
          echo "Authorization confirmed for operator: ZacharyCalvert."

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate target environment
        env:
          TARGET_ENV: ${{ inputs.environment || 'stage' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Triggered by event: $EVENT_NAME"
          echo "Target Environment: $TARGET_ENV"
          if [ "$EVENT_NAME" = "push" ] && [ "$TARGET_ENV" != "stage" ]; then
            echo "Error: Automated push triggers are strictly restricted to the stage environment."
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Execute Schema Migration on RDS via ECS Fargate RunTask
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_MIGRATION_TASK_DEFINITION: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
          MIGRATION_SUBNETS: ${{ vars.MIGRATION_SUBNETS }}
          MIGRATION_SG: ${{ vars.MIGRATION_SG }}
        run: |
          python3 .github/scripts/run_ecs_sql.py \
            --sql-file backend-api/internal/database/init.sql \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${ECS_MIGRATION_TASK_DEFINITION}" \
            --subnets "${MIGRATION_SUBNETS}" \
            --security-group "${MIGRATION_SG}"
