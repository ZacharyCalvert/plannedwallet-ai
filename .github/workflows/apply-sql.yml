name: Apply Database Migrations (Azure PostgreSQL)

on:
  push:
    branches:
      - main
    paths:
      - 'backend-api/internal/database/init.sql'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - production

permissions:
  id-token: write
  contents: read

jobs:
  apply-sql:
    name: Apply SQL to ${{ inputs.environment || 'stage' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'stage' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate target environment
        env:
          TARGET_ENV: ${{ inputs.environment || 'stage' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Triggered by event: $EVENT_NAME"
          echo "Target Environment: $TARGET_ENV"
          if [ "$EVENT_NAME" = "push" ] && [ "$TARGET_ENV" != "stage" ]; then
            echo "Error: Automated push triggers are strictly restricted to the stage environment."
            exit 1
          fi

      - name: Azure Login via OIDC Federated Trust
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute Raw SQL Script inside VNet via Container App Job
        env:
          TARGET_ENV: ${{ inputs.environment || 'stage' }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || (inputs.environment == 'production' && 'rg-plannedwallet-prod' || 'rg-plannedwallet-stage') }}
          MIGRATION_JOB_NAME: ${{ vars.MIGRATION_JOB_NAME || (inputs.environment == 'production' && 'job-pw-prod-migrations' || 'job-pw-stage-migrations') }}
          CONTAINER_IMAGE: ${{ vars.MIGRATION_CONTAINER_IMAGE || 'postgres:16-alpine' }}
          SQL_FILE_PATH: 'backend-api/internal/database/init.sql'
        run: |
          echo "Target Environment: $TARGET_ENV"
          echo "Resource Group: $AZURE_RESOURCE_GROUP"
          echo "Migration Job: $MIGRATION_JOB_NAME"
          echo "Container Image: $CONTAINER_IMAGE"

          # 1. Fetch current job template
          echo "Fetching job template for '$MIGRATION_JOB_NAME'..."
          az containerapp job show \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template" \
            -o json > /tmp/migration-template.json

          # 2. Modify template to execute SQL script via python helper
          python3 .github/scripts/prepare-migration-job.py \
            /tmp/migration-template.json \
            "$SQL_FILE_PATH" \
            "$CONTAINER_IMAGE"

          # 3. Start Container App Job execution using the prepared template
          echo "Starting Container App Job '$MIGRATION_JOB_NAME'..."
          EXEC_NAME=$(az containerapp job start \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --yaml /tmp/migration-template.json \
            --query "name" -o tsv)

          if [ -z "$EXEC_NAME" ]; then
            echo "Error: Failed to initiate Container App Job execution."
            exit 1
          fi

          echo "Container App Job execution started: $EXEC_NAME"
          echo "Monitoring execution status..."

          # 4. Poll execution status until completion
          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=300 # 5 minutes max

          while true; do
            STATUS=$(az containerapp job execution show \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv 2>/dev/null || echo "Unknown")

            echo "Current execution status: $STATUS"

            if [ "$STATUS" = "Succeeded" ]; then
              echo "Database schema migration completed successfully inside the VNet."
              echo "--- Container Execution Logs ---"
              az containerapp job logs show \
                --name "$MIGRATION_JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --container "$MIGRATION_JOB_NAME" \
                --execution "$EXEC_NAME" \
                --tail 300 || true
              echo "--- End Container Execution Logs ---"
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "Error: Database migration job execution failed in Azure Container Apps."
              echo "--- Container Execution Logs ---"
              az containerapp job logs show \
                --name "$MIGRATION_JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --container "$MIGRATION_JOB_NAME" \
                --execution "$EXEC_NAME" \
                --tail 300 || true
              echo "--- End Container Execution Logs ---"
              az containerapp job execution show \
                --name "$MIGRATION_JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --job-execution-name "$EXEC_NAME" \
                --output json || true
              exit 1
            fi

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            if [ $ELAPSED -ge $TIMEOUT_SECONDS ]; then
              echo "Error: Timed out after $TIMEOUT_SECONDS seconds waiting for migration job to complete."
              exit 1
            fi

            sleep 5
          done
