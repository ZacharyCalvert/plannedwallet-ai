name: Frontend UI CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-ui/**'
      - '.github/workflows/frontend-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Test, Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend-ui
        run: |
          npm ci

      - name: Run tests
        working-directory: frontend-ui
        run: |
          npm test

      - name: Build Next.js static export
        working-directory: frontend-ui
        run: |
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-ui
          file: ./frontend-ui/Dockerfile
          load: true
          tags: frontend-ui:test
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Start frontend-ui container
        run: |
          docker run -d --name frontend-ui-test -p 8282:8282 frontend-ui:test
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8282 >/dev/null 2>&1; then
              echo "Frontend UI container is ready"
              exit 0
            fi
            echo "Waiting for Frontend UI ($i/30)..."
            sleep 1
          done
          echo "Frontend UI failed to start within timeout"
          docker logs frontend-ui-test
          exit 1

      - name: Verify static asset response
        run: |
          curl -s -f http://localhost:8282 | grep -q "Planned Wallet"
          echo "Frontend static asset response verified successfully"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs frontend-ui-test

      - name: Stop frontend-ui test container
        if: always()
        run: docker rm -f frontend-ui-test || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend-ui
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-ui
          file: ./frontend-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
