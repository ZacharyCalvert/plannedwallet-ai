name: Frontend UI CI/CD
run-name: "Frontend UI CI/CD [${{ ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.environment == 'prod') && 'prod' || 'stage' }}] (${{ github.event_name }})"

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-ui/**'
      - '.github/workflows/frontend-ui.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
  workflow_call:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: false
        default: 'stage'
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-and-build:
    name: Test, Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend-ui
        run: |
          npm ci

      - name: Run tests
        working-directory: frontend-ui
        run: |
          npm test

      - name: Build Next.js static export
        working-directory: frontend-ui
        run: |
          npm run build

      - name: Verify static export entry point and 404 fallback
        run: |
          echo "Verifying static export contents..."
          if [ ! -f frontend-ui/out/index.html ]; then
            echo "Error: Required entry point index.html not found in frontend-ui/out!"
            exit 1
          fi
          if [ ! -f frontend-ui/out/404.html ]; then
            echo "Error: Required fallback 404.html not found in frontend-ui/out!"
            exit 1
          fi
          echo "Static export verified: index.html and 404.html are present."

      - name: Upload static export artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-static-out
          path: frontend-ui/out
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-ui
          file: ./frontend-ui/Dockerfile
          load: true
          tags: frontend-ui:test
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Start frontend-ui container
        run: |
          docker run -d --name frontend-ui-test -p 8282:8282 frontend-ui:test
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8282 >/dev/null 2>&1; then
              echo "Frontend UI container is ready"
              exit 0
            fi
            echo "Waiting for Frontend UI ($i/30)..."
            sleep 1
          done
          echo "Frontend UI failed to start within timeout"
          docker logs frontend-ui-test
          exit 1

      - name: Verify static asset response
        run: |
          curl -s -f http://localhost:8282 | grep -q "Planned Wallet"
          echo "Frontend static asset response verified successfully"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs frontend-ui-test

      - name: Stop frontend-ui test container
        if: always()
        run: docker rm -f frontend-ui-test || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend-ui
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-ui
          file: ./frontend-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy-static:
    name: Deploy Static to AWS S3 & CloudFront (${{ ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.environment == 'prod') && 'prod' || 'stage' }})
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.actor == 'ZacharyCalvert'
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.environment == 'prod') && 'prod' || 'stage' }}
    concurrency:
      group: deployment-${{ ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.environment == 'prod') && 'prod' || 'stage' }}
      cancel-in-progress: false

    steps:
      - name: Enforce operator authorization (ZacharyCalvert only)
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != "ZacharyCalvert" ]; then
            echo "::error::Access Denied: Only user 'ZacharyCalvert' is authorized to deploy to AWS. Execution by '$ACTOR' rejected."
            exit 1
          fi
          echo "Authorization confirmed for operator: ZacharyCalvert."

      - name: Validate target environment and branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Triggered by event: $EVENT_NAME"
          echo "Triggered on branch: $BRANCH"
          echo "Input Environment: $INPUT_ENV"
          if [ "$BRANCH" != "main" ]; then
            echo "Error: deploy-static is strictly restricted to run ONLY from the 'main' branch."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ -n "$INPUT_ENV" ] && [ "$INPUT_ENV" != "stage" ]; then
            echo "Error: Automated push triggers are strictly restricted to the stage environment."
            exit 1
          fi

      - name: Download static export artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-static-out
          path: ./out

      - name: Verify static export files
        run: |
          echo "Verifying downloaded static files in ./out..."
          if [ ! -f ./out/index.html ]; then
            echo "Error: Required entry point index.html missing from downloaded artifacts!"
            exit 1
          fi
          if [ ! -f ./out/404.html ]; then
            echo "Error: Required fallback 404.html missing from downloaded artifacts!"
            exit 1
          fi
          echo "Verified static export: index.html and 404.html are present."

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Sync Static Assets to S3 and Invalidate CloudFront Cache
        env:
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$FRONTEND_S3_BUCKET" ] || [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "::error::FRONTEND_S3_BUCKET and CLOUDFRONT_DISTRIBUTION_ID environment variables are required."
            exit 1
          fi

          echo "Syncing immutable static assets to s3://${FRONTEND_S3_BUCKET}/..."
          aws s3 sync ./out/ "s3://${FRONTEND_S3_BUCKET}/" \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

          echo "Syncing HTML entrypoints with must-revalidate Cache-Control..."
          aws s3 sync ./out/ "s3://${FRONTEND_S3_BUCKET}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "Creating CloudFront invalidation for distribution ${CLOUDFRONT_DISTRIBUTION_ID}..."
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
          echo "Frontend deployment to S3 + CloudFront completed."
