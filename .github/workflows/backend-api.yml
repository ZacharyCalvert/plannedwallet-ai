name: Backend API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend-api/**'
      - 'itests/**'
      - '.github/workflows/backend-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Test, Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: backend-api/go.sum

      - name: Run unit tests
        working-directory: backend-api
        run: |
          go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./backend-api
          file: ./backend-api/Dockerfile
          load: true
          tags: backend-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Start PostgreSQL container
        run: |
          docker network create backend-net || true
          docker run -d \
            --name postgres-test \
            --network backend-net \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=plannedwallet \
            -p 5432:5432 \
            postgres:16
          until docker exec postgres-test pg_isready -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL is ready"

      - name: Start backend-api container
        run: |
          docker run -d \
            --name backend-api-test \
            --network backend-net \
            -p 8080:8080 \
            -e POSTGRES_HOST=postgres-test \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=plannedwallet \
            -e POSTGRES_SSLMODE=disable \
            backend-api:test
          for i in $(seq 1 30); do
            if curl -s -f -H "X-Client-ID: github-action" http://localhost:8080/api/v1/hello >/dev/null 2>&1; then
              echo "Backend API is ready"
              exit 0
            fi
            echo "Waiting for Backend API ($i/30)..."
            sleep 1
          done
          echo "Backend API failed to start within timeout"
          docker logs backend-api-test
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: itests/requirements.txt

      - name: Run integration tests
        run: |
          make -C itests test TARGET_SERVER=http://localhost:8080

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs backend-api-test || true
          docker logs postgres-test || true

      - name: Stop test containers
        if: always()
        run: |
          docker rm -f backend-api-test || true
          docker rm -f postgres-test || true
          docker network rm backend-net || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-api
          file: ./backend-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
