name: Backend API CI/CD
run-name: "Backend API CI/CD [${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'prod' || 'stage' }}] (${{ github.event_name }})"

on:
  push:
    branches:
      - main
    paths:
      - 'backend-api/**'
      - 'itests/**'
      - '.github/workflows/backend-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
      run_migrations:
        description: 'Execute ephemeral database migration job before deploying'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-and-build:
    name: Test, Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: backend-api/go.sum

      - name: Run unit tests
        working-directory: backend-api
        run: |
          go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Capture Build Provenance Metadata
        id: build_meta
        run: |
          echo "github_run=${{ github.run_number }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "git_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./backend-api
          file: ./backend-api/Dockerfile
          load: true
          tags: backend-api:test
          build-args: |
            GITHUB_RUN=${{ steps.build_meta.outputs.github_run }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            GIT_SHA=${{ steps.build_meta.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Start PostgreSQL container
        run: |
          docker network create backend-net || true
          docker run -d \
            --name postgres-test \
            --network backend-net \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=plannedwallet \
            -p 5432:5432 \
            postgres:16
          until docker exec postgres-test pg_isready -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL is ready"

      - name: Start backend-api container
        run: |
          docker run -d \
            --name backend-api-test \
            --network backend-net \
            -p 8080:8080 \
            -e POSTGRES_HOST=postgres-test \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=plannedwallet \
            -e POSTGRES_SSLMODE=disable \
            -e ENFORCE_POLICY=false \
            -e PW_TERMS=4906a573260b73ad9c9c5b95c7492cca669ce4354e91a7ba4383a955d85bfb80 \
            backend-api:test
          for i in $(seq 1 30); do
            if curl -s -f -H "X-Client-ID: github-action" http://localhost:8080/api/v1/hello >/dev/null 2>&1; then
              echo "Backend API is ready"
              exit 0
            fi
            echo "Waiting for Backend API ($i/30)..."
            sleep 1
          done
          echo "Backend API failed to start within timeout"
          docker logs backend-api-test
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: itests/requirements.txt

      - name: Run integration tests
        run: |
          make -C itests test TARGET_SERVER=http://localhost:8080

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs backend-api-test || true
          docker logs postgres-test || true

      - name: Stop test containers
        if: always()
        run: |
          docker rm -f backend-api-test || true
          docker rm -f postgres-test || true
          docker network rm backend-net || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend-api
          file: ./backend-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_RUN=${{ steps.build_meta.outputs.github_run }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            GIT_SHA=${{ steps.build_meta.outputs.git_sha }}
          cache-from: type=gha

  deploy-backend:
    name: Deploy Backend to AWS ECS Fargate (${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'prod' || 'stage' }})
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.actor == 'ZacharyCalvert'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'prod' || 'stage' }}
    concurrency:
      group: deployment-${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'prod' || 'stage' }}
      cancel-in-progress: false

    steps:
      - name: Enforce operator authorization (ZacharyCalvert only)
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != "ZacharyCalvert" ]; then
            echo "::error::Access Denied: Only user 'ZacharyCalvert' is authorized to deploy to AWS. Execution by '$ACTOR' rejected."
            exit 1
          fi
          echo "Authorization confirmed for operator: ZacharyCalvert."

      - name: Validate target environment and branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Triggered by event: $EVENT_NAME"
          echo "Triggered on branch: $BRANCH"
          echo "Input Environment: $INPUT_ENV"
          if [ "$BRANCH" != "main" ]; then
            echo "Error: deploy-backend is strictly restricted to run ONLY from the 'main' branch."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ -n "$INPUT_ENV" ] && [ "$INPUT_ENV" != "stage" ]; then
            echo "Error: Automated push triggers are strictly restricted to the stage environment."
            exit 1
          fi
          TARGET_ENV="stage"
          if [ "$INPUT_ENV" = "prod" ]; then
            TARGET_ENV="prod"
          fi
          echo "TARGET_ENV=${TARGET_ENV}" >> "$GITHUB_ENV"

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Immutable Backend Image to Amazon ECR
        id: build_ecr
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "::error::ECR_REPOSITORY environment variable must be set."
            exit 1
          fi

          GITHUB_RUN="${{ github.run_number }}-${{ github.run_id }}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GIT_SHA="${{ github.sha }}"
          IMAGE_TAG="${GIT_SHA}"
          if aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            IMAGE_TAG="${GIT_SHA}-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Immutable tag ${GIT_SHA} already exists in ECR; using unique run tag ${IMAGE_TAG}."
          fi
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "DEPLOYED_GITHUB_RUN=${GITHUB_RUN}" >> "$GITHUB_ENV"
          echo "DEPLOYED_BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "DEPLOYED_GIT_SHA=${GIT_SHA}" >> "$GITHUB_ENV"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "Building linux/amd64 image: $IMAGE_URI (run=$GITHUB_RUN, date=$BUILD_DATE, sha=$GIT_SHA)..."
          docker build \
            --platform linux/amd64 \
            --file backend-api/Dockerfile \
            --build-arg "GITHUB_RUN=${GITHUB_RUN}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "GIT_SHA=${GIT_SHA}" \
            --tag "$IMAGE_URI" \
            ./backend-api

          echo "Pushing immutable image tag to Amazon ECR..."
          docker push "$IMAGE_URI"
          echo "Backend container image pushed to Amazon ECR."

      - name: "Safeguard: Fetch & Inspect Backend ECS Task Definition"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
        run: |
          if [ -z "$ECS_CLUSTER" ] || [ -z "$ECS_SERVICE" ] || [ -z "$ECS_TASK_DEFINITION" ]; then
            echo "::error::ECS_CLUSTER, ECS_SERVICE, and ECS_TASK_DEFINITION environment variables must be set."
            exit 1
          fi

          echo "Describing backend ECS task definition '${ECS_TASK_DEFINITION}'..."
          aws ecs describe-task-definition \
            --region "${AWS_REGION}" \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --query "taskDefinition" \
            --output json > task-def.json

          python3 .github/scripts/verify_ecs_taskdef_env.py task-def.json "${TARGET_ENV}" --container-name backend

      - name: Run Database Migrations (ECS Fargate RunTask)
        if: ${{ github.event_name == 'push' || inputs.run_migrations != false }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_MIGRATION_TASK_DEFINITION: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
          MIGRATION_SUBNETS: ${{ vars.MIGRATION_SUBNETS }}
          MIGRATION_SG: ${{ vars.MIGRATION_SG }}
        run: |
          python3 .github/scripts/run_ecs_sql.py \
            --sql-file backend-api/internal/database/init.sql \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${ECS_MIGRATION_TASK_DEFINITION}" \
            --subnets "${MIGRATION_SUBNETS}" \
            --security-group "${MIGRATION_SG}"

      - name: Render Amazon ECS Task Definition
        id: render_task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: backend
          image: ${{ steps.build_ecr.outputs.image_uri }}

      - name: Deploy Amazon ECS Task Definition to Fargate Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render_task_def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy Verification Gate (/api/v1/version within 2 minutes)
        run: |
          BASE_URL="${{ vars.BACKEND_URL || '' }}"
          if [ -z "$BASE_URL" ]; then
            CUSTOM_DOMAIN="${{ vars.CUSTOM_DOMAIN || '' }}"
            if [ -z "$CUSTOM_DOMAIN" ]; then
              if [ "$TARGET_ENV" = "prod" ]; then
                CUSTOM_DOMAIN="www.plannedwallet.com"
              else
                CUSTOM_DOMAIN="stage.plannedwallet.com"
              fi
            fi
            BASE_URL="https://${CUSTOM_DOMAIN}"
          fi

          BASE_URL="${BASE_URL%/}"
          VERSION_URL="${BASE_URL}/api/v1/version"
          TIMEOUT_SECONDS=120
          START_TIME=$(date +%s)
          LAST_RESPONSE="<no response>"

          echo "Verifying deployed version at $VERSION_URL (timeout: ${TIMEOUT_SECONDS}s)"
          echo "Expected: github_run='${DEPLOYED_GITHUB_RUN}', build_date='${DEPLOYED_BUILD_DATE}', git_sha='${DEPLOYED_GIT_SHA}'"

          while true; do
            BODY=$(curl -sS --max-time 5 \
              -H "X-Client-ID: github-actions-deploy-gate" \
              -H "Cache-Control: no-cache" \
              "${VERSION_URL}?_ts=$(date +%s)" 2>&1 || true)

            if [ -n "$BODY" ]; then
              LAST_RESPONSE="$BODY"
            fi

            if python3 -c "import json, sys; d = json.loads(sys.argv[1]); sys.exit(0 if d.get('github_run') == sys.argv[2] and d.get('build_date') == sys.argv[3] and d.get('git_sha') == sys.argv[4] else 1)" "$BODY" "${DEPLOYED_GITHUB_RUN}" "${DEPLOYED_BUILD_DATE}" "${DEPLOYED_GIT_SHA}" 2>/dev/null; then
              ELAPSED=$(( $(date +%s) - START_TIME ))
              echo "Deploy verification PASSED in ${ELAPSED}s: ${LAST_RESPONSE}"
              exit 0
            fi

            ELAPSED=$(( $(date +%s) - START_TIME ))
            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "::error::Deploy verification gate failed: expected version (run=${DEPLOYED_GITHUB_RUN}, build_date=${DEPLOYED_BUILD_DATE}, git_sha=${DEPLOYED_GIT_SHA}) was not served at ${VERSION_URL} within ${TIMEOUT_SECONDS}s. Last response: ${LAST_RESPONSE}"
              exit 1
            fi

            echo "Waiting for new revision (${ELAPSED}/${TIMEOUT_SECONDS}s)... last response: ${LAST_RESPONSE}"
            sleep 5
          done
