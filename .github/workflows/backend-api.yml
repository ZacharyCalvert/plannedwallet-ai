name: Backend API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend-api/**'
      - '.github/workflows/backend-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Test, Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend-api/go.sum

      - name: Run unit tests
        working-directory: backend-api
        run: |
          go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plannedwallet-be:latest
            ghcr.io/${{ github.repository_owner }}/plannedwallet-be:${{ github.sha }}
