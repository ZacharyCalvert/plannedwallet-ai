        '400':
          summary: Bad request
          description: Invalid transaction values, date formats, or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          description: No checking account found matching the provided accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Checking Records
      summary: List checking account records
      description: |
        Retrieves records for the specified checking account, with optional filtering by clearance status and date range.
        Requires a valid JWT Bearer token.
      operationId: listCheckingRecords
      security:
        - BearerAuth: []
      parameters:
        - name: cleared
          in: query
          required: false
          description: Filter records by cleared status (true for cleared, false for pending).
          schema:
            type: boolean
            example: false
        - name: start_date
          in: query
          required: false
          description: Filter records with date_sent on or after this date (inclusive).
          schema:
            type: string
            format: date
            example: "2026-11-01"
        - name: end_date
          in: query
          required: false
          description: Filter records with date_sent on or before this date (inclusive).
          schema:
            type: string
            format: date
            example: "2026-11-30"
      responses:
        '200':
          summary: List of checking records
          description: Returns an array of checking account records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          description: No checking account found matching the provided accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/records/bulk:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the checking, savings, or credit card account.
        schema:
          type: string
          format: uuid
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"

    post:
      tags:
        - Checking Records
      summary: Bulk add checking account records (max 1,000 per request)
      description: |
        Atomically creates between 1 and 1,000 transaction records for a checking, savings, or credit card account
        in a single database transaction. Requests containing 0 records or more than 1,000 records are rejected
        with `400 Bad Request` (`INVALID_BULK_RECORDS` or `BULK_LIMIT_EXCEEDED`).
        Requires a valid JWT Bearer token with `admin` or `edit` access to the account.
      operationId: createCheckingRecordsBulk
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckingRecordBulkCreateRequest'
      responses:
        '201':
          summary: Checking records created in bulk
          description: All checking records in the batch were atomically created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordBulkCreateResponse'
        '400':
          summary: Bad request
          description: Empty batch, batch exceeds 1,000-record hard limit (`BULK_LIMIT_EXCEEDED`), invalid dates, or invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: User has read-only access to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account or category not found
          description: No accessible account or category found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

