components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authenticate using a JWT issued by POST `/api/v1/users/{username}/token`.
        Provide the token in the HTTP `Authorization` header with the format: `Bearer <token>`.

  parameters:
    XClientId:
      name: X-Client-ID
      in: header
      required: true
      description: Identifier of the client application making the request, used for debugging and caller identification purposes.
      schema:
        type: string
        example: "nextjs-static"

  schemas:
    AccountType:
      type: string
      description: The type of financial account.
      enum:
        - checking
        - savings
        - credit card
        - asset
        - assets
        - snapshot
      example: "asset"

    UserRegistrationRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Unique username stored in plaintext in the users table.
          example: "johndoe"
        email:
          type: string
          format: email
          maxLength: 255
          description: User's contact email stored in plaintext in the users table.
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          minLength: 10
          writeOnly: true
          description: Plaintext password provided during registration; hashed with bcrypt and salted before persistence. Must be at least 10 characters and contain at least 1 uppercase letter, 1 lowercase letter, 1 number, and 1 non-alphanumeric special character.
          example: "P@ssw0rd123!"

    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user.
          example: "d3b07384-d113-4e00-9922-b06f9d453b34"
        username:
          type: string
          description: Unique username stored in plaintext.
          example: "johndoe"
        email:
          type: string
          format: email
          description: User email stored in plaintext.
          example: "john.doe@example.com"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the user was created.
          example: "2026-11-09T19:00:00Z"
        totp_secret:
          type: string
          description: Base32-encoded TOTP secret key for two-factor authentication setup.
          example: "JBSWY3DPEHPK3PXP"
        totp_url:
          type: string
          description: Standard otpauth URL for generating authenticator QR codes.
          example: "otpauth://totp/PlannedWallet:johndoe?secret=JBSWY3DPEHPK3PXP&issuer=PlannedWallet"

    TokenExchangeRequest:
      type: object
      required:
        - password
        - totp_code
      properties:
        password:
          type: string
          format: password
          description: The user's plaintext password to verify against the stored bcrypt hash.
          example: "P@ssw0rd123!"
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The current 6-digit TOTP code generated by the user's authenticator app.
          example: "123456"

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The signed JWT access token.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          description: Type of authorization token.
          example: "Bearer"
        expires_in:
          type: integer
          description: Token validity duration in seconds.
          example: 3600

    AccountCreationRequest:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: User-facing display name for the account in the UI.
          example: "Everyday Checking"
        type:
          $ref: '#/components/schemas/AccountType'
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable description or label for the account.
          example: "Primary Everyday Checking Account"

    AccountResponse:
      type: object
      required:
        - id
        - admin_id
        - name
        - type
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the account.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        admin_id:
          type: string
          format: uuid
          description: Identifier of the admin/owner user for this account.
          example: "d3b07384-d113-4e00-9922-b06f9d453b34"
        name:
          type: string
          description: User-facing display name for the account in the UI.
          example: "Everyday Checking"
        type:
          $ref: '#/components/schemas/AccountType'
        description:
          type: string
          description: Human-readable description of the account.
          example: "Primary Everyday Checking Account"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the account was created.
          example: "2026-11-09T19:15:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the account was last updated.
          example: "2026-11-09T19:15:00Z"

    AccessLevel:
      type: string
      description: Level of access granted to a user for an account.
      enum:
        - read
        - edit
        - admin
      example: "admin"

    AccountAccessResponse:
      type: object
      required:
        - id
        - account_id
        - user_id
        - access_level
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the access grant record.
          example: "b1f8e21a-4d2b-4e12-85a2-c1f034567890"
        account_id:
          type: string
          format: uuid
          description: Identifier of the account.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        user_id:
          type: string
          format: uuid
          description: Identifier of the user granted access.
          example: "d3b07384-d113-4e00-9922-b06f9d453b34"
        access_level:
          $ref: '#/components/schemas/AccessLevel'
        created_at:
          type: string
          format: date-time
          description: Timestamp when access was granted.
          example: "2026-11-10T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when access was last modified.
          example: "2026-11-10T09:00:00Z"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: High-level error classification or code.
          example: "INVALID_CREDENTIALS"
        message:
          type: string
          description: Detailed human-readable error description.
          example: "The password provided does not match our records."
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred.
          example: "2026-11-09T19:15:00Z"

    CheckingRecordCreateRequest:
      type: object
      required:
        - value
        - date_sent
        - entity
      properties:
        value:
          type: number
          format: double
          description: Amount of the transaction (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: The date the check or payment was issued or sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: The date the bank accepted or logged the transaction. Omit or pass null if pending.
          example: "2026-11-12"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Who the money was spent with, check written to, or payment received from.
          example: "Corner Grocery"
        description:
          type: string
          maxLength: 500
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"

    CheckingRecordUpdateRequest:
      type: object
      required:
        - value
        - date_sent
        - entity
      properties:
        value:
          type: number
          format: double
          description: Amount of the transaction (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: The date the check or payment was issued or sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: The date the bank accepted or logged the transaction. Set to null if uncleared.
          example: "2026-11-12"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Who the money was spent with, check written to, or payment received from.
          example: "Corner Grocery"
        description:
          type: string
          maxLength: 500
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"

    CheckingRecordPatchRequest:
      type: object
      description: Fields to update on the checking record. Any omitted fields remain unchanged.
      properties:
        value:
          type: number
          format: double
          description: Updated transaction amount.
          example: -125.50
        date_sent:
          type: string
          format: date
          description: Updated date sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: Set to mark the transaction as cleared by the bank, or null to revert to pending.
          example: "2026-11-12"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Updated counterparty entity.
          example: "Corner Grocery"
        description:
          type: string
          maxLength: 500
          description: Updated memo or note.
          example: "Weekly groceries and household supplies"

    CheckingRecordResponse:
      type: object
      required:
        - id
        - account_id
        - value
        - date_sent
        - entity
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the checking record.
          example: "8f7b3a42-9a3b-48d0-8f92-23c2a6be8e14"
        account_id:
          type: string
          format: uuid
          description: Identifier of the checking account this record belongs to.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        value:
          type: number
          format: double
          description: Transaction amount (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: Date the check was written or payment was sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: Date the bank cleared or logged the transaction. Null if pending.
          example: "2026-11-12"
        entity:
          type: string
          description: Who the transaction was with (payee, merchant, or payer).
          example: "Corner Grocery"
        description:
          type: string
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
          example: "2026-11-09T19:25:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was last updated.
          example: "2026-11-09T19:25:00Z"

    AssetCreateRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique identifier or symbol for the asset (e.g. btc, eth, silver, gold, tx-gas).
          example: "btc"
        description:
          type: string
          maxLength: 200
          description: Optional description of the asset (up to 200 characters).
          example: "Bitcoin cryptocurrency"

    AssetUpdateRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique identifier or symbol for the asset (e.g. btc, eth, silver, gold, tx-gas).
          example: "btc"
        description:
          type: string
          maxLength: 200
          description: Optional description of the asset (up to 200 characters).
          example: "Bitcoin cryptocurrency"

    AssetResponse:
      type: object
      required:
        - id
        - label
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the asset.
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Identifier of the user who owns this asset, or null if system/global.
          example: "3bf40ddb-9c1d-4b83-b1df-714c7941c9cc"
        label:
          type: string
          description: Identifier or symbol for the asset (e.g. btc, eth, silver, gold, tx-gas).
          example: "btc"
        description:
          type: string
          description: Description of the asset.
          example: "Bitcoin cryptocurrency"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the asset was created.
          example: "2026-11-12T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the asset was last updated.
          example: "2026-11-12T10:00:00Z"

    AssetValueCreateRequest:
      type: object
      required:
        - value
        - value_date
      properties:
        value:
          type: number
          format: double
          description: USD value assignment for the asset on the given date.
          example: 95400.50
        value_date:
          type: string
          format: date
          description: The date the value is assigned (YYYY-MM-DD).
          example: "2025-01-01"

    AssetValueUpdateRequest:
      type: object
      required:
        - value
        - value_date
      properties:
        value:
          type: number
          format: double
          description: USD value assignment for the asset on the given date.
          example: 95400.50
        value_date:
          type: string
          format: date
          description: The date the value is assigned (YYYY-MM-DD).
          example: "2025-01-01"

    AssetValueResponse:
      type: object
      required:
        - id
        - asset_id
        - value
        - value_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the asset valuation record.
          example: "c1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        asset_id:
          type: string
          format: uuid
          description: Identifier of the asset this valuation belongs to.
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        value:
          type: number
          format: double
          description: USD value assignment.
          example: 95400.50
        value_date:
          type: string
          format: date
          description: The date the value is assigned.
          example: "2025-01-01"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
          example: "2026-11-12T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was last updated.
          example: "2026-11-12T10:00:00Z"

    AccountAccessGrantRequest:
      type: object
      required:
        - user_id
        - access_level
      properties:
        user_id:
          type: string
          format: uuid
          description: Unique identifier of the user to grant access to.
          example: "e5f6a1b2-c3d4-e5f6-a1b2-c3d4e5f6a1b2"
        access_level:
          $ref: '#/components/schemas/AccessLevel'

    AccountAssetAddRequest:
      type: object
      required:
        - asset_id
        - quantity
      properties:
        asset_id:
          type: string
          format: uuid
          description: Identifier of the asset to add to the account.
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        quantity:
          type: number
          format: double
          minimum: 0.00000001
          description: Held quantity of the asset (must be greater than 0).
          example: 45.209

    AccountAssetUpdateRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: number
          format: double
          minimum: 0.00000001
          description: New held quantity of the asset (must be greater than 0).
          example: 50.0

    AccountAssetResponse:
      type: object
      required:
        - id
        - account_id
        - asset_id
        - label
        - description
        - quantity
        - latest_value
        - total_value
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the account asset holding record.
          example: "f1a2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c"
        account_id:
          type: string
          format: uuid
          description: Identifier of the asset account.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        asset_id:
          type: string
          format: uuid
          description: Identifier of the asset.
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        label:
          type: string
          description: Label of the asset (e.g. slv-oz, btc, gld-oz).
          example: "slv-oz"
        description:
          type: string
          description: Description of the asset.
          example: "Silver 1 Troy Ounce"
        quantity:
          type: number
          format: double
          description: Quantity held in the account.
          example: 45.209
        latest_value:
          type: number
          format: double
          description: Latest known per-unit valuation of the asset in USD.
          example: 32.50
        latest_value_date:
          type: string
          format: date
          nullable: true
          description: Date of the latest valuation.
          example: "2026-11-12"
        total_value:
          type: number
          format: double
          description: Computed total worth (quantity * latest_value).
          example: 1469.2925
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssetAccountSummaryResponse:
      type: object
      required:
        - account_id
        - total_value
        - assets
      properties:
        account_id:
          type: string
          format: uuid
          description: Identifier of the asset account.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        total_value:
          type: number
          format: double
          description: Aggregated current value of all assets in the account.
          example: 1469.2925
        assets:
          type: array
          description: List of asset holdings with their latest valuations.
          items:
            $ref: '#/components/schemas/AccountAssetResponse'

    AccountSnapshotCreateRequest:
      type: object
      required:
        - value
        - snapshot_date
      properties:
        value:
          type: number
          format: double
          description: Manual valuation of the account on the specified date in USD.
          example: 1200.00
        snapshot_date:
          type: string
          format: date
          description: Date of the snapshot (YYYY-MM-DD).
          example: "2026-11-11"

    AccountSnapshotUpdateRequest:
      type: object
      required:
        - value
        - snapshot_date
      properties:
        value:
          type: number
          format: double
          description: Updated valuation of the account in USD.
          example: 1210.00
        snapshot_date:
          type: string
          format: date
          description: Updated date of the snapshot (YYYY-MM-DD).
          example: "2026-11-12"

    AccountSnapshotResponse:
      type: object
      required:
        - id
        - account_id
        - value
        - snapshot_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the snapshot record.
          example: "b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e"
        account_id:
          type: string
          format: uuid
          description: Unique identifier of the snapshot account.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        value:
          type: number
          format: double
          description: Valuation of the account on the specified date in USD.
          example: 1200.00
        snapshot_date:
          type: string
          format: date
          description: Date of the valuation (YYYY-MM-DD).
          example: "2026-11-11"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the snapshot was recorded.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the snapshot was last updated.

