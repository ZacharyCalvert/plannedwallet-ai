          format: double
          description: Amount of the transaction (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: The date the check or payment was issued or sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: The date the bank accepted or logged the transaction. Omit or pass null if pending.
          example: "2026-11-12"
        category_id:
          type: string
          format: uuid
          nullable: true
          description: Optional category UUID assigned to the transaction.
          example: "00000000-0000-4000-8000-000000000003"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Who the money was spent with, check written to, or payment received from.
          example: "Corner Grocery"
        description:
          type: string
          maxLength: 500
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"

    CheckingRecordUpdateRequest:
      type: object
      required:
        - value
        - date_sent
        - entity
      properties:
        value:
          type: number
          format: double
          description: Amount of the transaction (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: The date the check or payment was issued or sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: The date the bank accepted or logged the transaction. Set to null if uncleared.
          example: "2026-11-12"
        category_id:
          type: string
          format: uuid
          nullable: true
          description: Optional category UUID assigned to the transaction.
          example: "00000000-0000-4000-8000-000000000003"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Who the money was spent with, check written to, or payment received from.
          example: "Corner Grocery"
        description:
          type: string
          maxLength: 500
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"

    CheckingRecordPatchRequest:
      type: object
      description: Fields to update on the checking record. Any omitted fields remain unchanged.
      properties:
        value:
          type: number
          format: double
          description: Updated transaction amount.
          example: -125.50
        date_sent:
          type: string
          format: date
          description: Updated date sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: Set to mark the transaction as cleared by the bank, or null to revert to pending.
          example: "2026-11-12"
        category_id:
          type: string
          format: uuid
          nullable: true
          description: Updated category UUID, or empty string to clear.
          example: "00000000-0000-4000-8000-000000000003"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Updated counterparty entity.
          example: "Corner Grocery"
        description:
          type: string
          maxLength: 500
          description: Updated memo or note.
          example: "Weekly groceries and household supplies"

