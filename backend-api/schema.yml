          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Perspectives
      summary: Link account to perspective
      description: Add an account into this aggregated perspective. User must have at least read access to the account.
      operationId: linkPerspectiveAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerspectiveAccountLinkRequest'
      responses:
        '201':
          description: Account linked successfully.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Perspective or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Account already linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/perspectives/{perspectiveId}/recurring-transactions:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: perspectiveId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Perspectives
      summary: List recurring transactions linked to a perspective
      operationId: listPerspectiveRecurringTransactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Linked recurring transactions (bills and income).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringTransactionResponse'
    post:
      tags:
        - Perspectives
      summary: Link a recurring transaction to a perspective
      operationId: linkPerspectiveRecurringTransaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerspectiveRecurringTransactionLinkRequest'
      responses:
        '201':
          description: Recurring transaction linked successfully.
        '404':
          description: Perspective or recurring transaction not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Recurring transaction already linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/perspectives/{perspectiveId}/recurring-transactions/{recurringId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: perspectiveId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: recurringId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - Perspectives
      summary: Unlink a recurring transaction from a perspective
      operationId: unlinkPerspectiveRecurringTransaction
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Recurring transaction unlinked.
        '404':
          description: Perspective or link not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/perspectives/{perspectiveId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: perspectiveId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the perspective.
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the account.
    delete:
      tags:
        - Perspectives
      summary: Unlink account from perspective
      description: Remove an account from this perspective viewing window.
      operationId: unlinkPerspectiveAccount
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account unlinked successfully.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not linked or perspective not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/perspectives/{perspectiveId}/access:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: perspectiveId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the perspective.
    get:
      tags:
        - Perspective Access
      summary: List perspective access grants
      description: List sharing permissions granted to users on this perspective. Requires admin permission.
      operationId: listPerspectiveAccess
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Access permissions list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerspectiveAccessResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Perspective not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Perspective Access
      summary: Grant perspective access
      description: Share perspective with another user or update access level (read, edit, admin). Requires admin permission.
      operationId: grantPerspectiveAccess
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerspectiveAccessGrantRequest'
      responses:
        '200':
          description: Access grant updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerspectiveAccessResponse'
        '400':
          description: Invalid access level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or perspective not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/perspectives/{perspectiveId}/access/{userId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: perspectiveId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the perspective.
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Target user identifier.
    get:
      tags:
        - Perspective Access
      summary: Get user access grant
      description: View access level granted to a specific user on this perspective.
      operationId: getPerspectiveAccess
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User access level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerspectiveAccessResponse'
        '404':
          description: Access grant or perspective not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Perspective Access
      summary: Revoke perspective access
      description: Remove sharing permissions for a user from this perspective. Requires admin permission.
      operationId: revokePerspectiveAccess
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Access revoked successfully.
        '400':
          description: Cannot revoke owner access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Access grant or perspective not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/perspectives/{perspectiveId}/view:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: perspectiveId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the perspective.
    get:
      tags:
        - Perspectives
      summary: Get perspective viewing window
      description: Retrieve aggregated financial trends and calculated analytical metrics (net worth, average daily spend, YoY return, ruined date forecasting) across linked accounts.
      operationId: getPerspectiveView
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perspective viewing window and aggregated analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerspectiveViewResponse'
        '404':
          description: Perspective not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/recurring-transactions:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Recurring Transactions
      summary: Create a recurring transaction
      description: Creates a private recurring transaction (negative amount = bill, positive amount = income) owned by the authenticated user.
      operationId: createRecurringTransaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringTransactionRequest'
      responses:
        '201':
          description: Recurring transaction created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringTransactionResponse'
        '400':
          description: Invalid amount, frequency, interval, schedule, name, account type, or category linkage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Recurring Transactions
      summary: List recurring transactions
      operationId: listRecurringTransactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of recurring transactions owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringTransactionResponse'

  /api/v1/recurring-transactions/reminders:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Recurring Transactions
      summary: List upcoming and overdue recurring transaction reminders
      description: Returns recurring transactions belonging to the authenticated user that have reminder enabled and a computed due_status of upcoming or overdue.
      operationId: listRecurringReminders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active recurring reminder alerts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringTransactionResponse'

  /api/v1/recurring-transactions/{recurringId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: recurringId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Recurring Transactions
      summary: Get a recurring transaction
      operationId: getRecurringTransaction
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Recurring transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringTransactionResponse'
        '404':
          description: Recurring transaction not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Recurring Transactions
      summary: Update a recurring transaction
      operationId: updateRecurringTransaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringTransactionRequest'
      responses:
        '200':
          description: Updated recurring transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringTransactionResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recurring transaction, account, or category not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Recurring Transactions
      summary: Delete a recurring transaction
      operationId: deleteRecurringTransaction
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Recurring transaction deleted.
        '404':
          description: Recurring transaction not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/recurring-transactions/{recurringId}/apply:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: recurringId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Recurring Transactions
      summary: Apply recurring transaction to target account
      description: Creates a transaction record in the recurring transaction's linked account (or specified override account_id) using its amount, entity, description, and category, and updates last_date_applied.
      operationId: applyRecurringTransactionToAccount
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringTransactionApplyRequest'
      responses:
        '201':
          description: Record created and last_date_applied updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringTransactionApplyResponse'
        '400':
          description: Recurring transaction has no linked account or invalid target account/date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recurring transaction or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authenticate using a JWT issued by POST `/api/v1/users/{username}/token`.
        The JWT contains `user_id`, `username`, `subscriber`, and `terms_approved` (boolean flag) claims.
        When `ENFORCE_POLICY=true` or `PRODUCTION_ENV=true`, protected routes require `terms_approved: true`
        and an active matching `policy_agreements` ledger entry (otherwise returning `403 POLICY_APPROVAL_REQUIRED`).
        Provide the token in the HTTP `Authorization` header with the format: `Bearer <token>`.

  parameters:
    XClientId:
      name: X-Client-ID
      in: header
      required: true
      description: Identifier of the client application making the request, used for debugging and caller identification purposes.
      schema:
        type: string
        example: "nextjs-static"

  schemas:
    AccountType:
      type: string
      description: The type of financial account.
      enum:
        - checking
        - savings
        - credit card
        - asset
        - assets
        - snapshot
      example: "asset"

    UserRegistrationRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Unique username stored in plaintext in the users table.
          example: "johndoe"
        email:
          type: string
          format: email
          maxLength: 255
          description: User's contact email stored in plaintext in the users table.
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          writeOnly: true
          description: Plaintext password provided during registration; hashed with bcrypt and salted before persistence. Must be 10-72 bytes and contain at least 1 uppercase letter, 1 lowercase letter, 1 number, and 1 non-alphanumeric special character.
          example: "P@ssw0rd123!"
        captcha_id:
          type: string
          description: Unique challenge ID of the CAPTCHA provided during registration.
          example: "0kL7k9Xm..."
        captcha_solution:
          type: string
          description: The 6-digit challenge solution matching the CAPTCHA image.
          example: "123456"

    CaptchaResponse:
      type: object
      required:
        - id
        - image
      properties:
        id:
          type: string
          description: Unique challenge identifier for the CAPTCHA.
          example: "0kL7k9Xm..."
        image:
          type: string
          description: Base64-encoded PNG data URI representing the challenge image.
          example: "data:image/png;base64,iVBORw0KGgo..."

    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user.
          example: "d3b07384-d113-4e00-9922-b06f9d453b34"
        username:
          type: string
          description: Unique username stored in plaintext.
          example: "johndoe"
        email:
          type: string
          format: email
          description: User email stored in plaintext.
          example: "john.doe@example.com"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the user was created.
          example: "2026-11-09T19:00:00Z"
        totp_secret:
          type: string
          description: Base32-encoded TOTP secret key for two-factor authentication setup.
          example: "JBSWY3DPEHPK3PXP"
        totp_url:
          type: string
          description: Standard otpauth URL for generating authenticator QR codes.
          example: "otpauth://totp/PlannedWallet:johndoe?secret=JBSWY3DPEHPK3PXP&issuer=PlannedWallet"
        recovery_phrase:
          type: string
          description: One-time 12-word mnemonic recovery phrase returned strictly at account creation.
          example: "abject beacon canyon domain emblem harbor ivory lantern meadow quartz summit timber"
        recovery_key_hint:
          type: string
          description: Masked trailing hint for recognizing the active recovery phrase without revealing it.
          example: "••••mber"

    AccountRecoveryRequest:
      type: object
      required:
        - recovery_phrase
        - new_password
      properties:
        recovery_phrase:
          type: string
          description: User's 12-word recovery phrase.
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          description: New account password (10-72 bytes) satisfying complexity rules.
        captcha_id:
          type: string
        captcha_solution:
          type: string

    AccountRecoveryResponse:
      type: object
      required:
        - username
        - totp_secret
        - totp_url
        - recovery_phrase
        - recovery_key_hint
      properties:
        username:
          type: string
        totp_secret:
          type: string
        totp_url:
          type: string
        recovery_phrase:
          type: string
        recovery_key_hint:
          type: string

    RotateRecoveryKeyRequest:
      type: object
      required:
        - password
        - totp_code
      properties:
        password:
          type: string
          format: password
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'

    RotateRecoveryKeyResponse:
      type: object
      required:
        - recovery_phrase
        - recovery_key_hint
        - created_at
      properties:
        recovery_phrase:
          type: string
        recovery_key_hint:
          type: string
        created_at:
          type: string
          format: date-time

    PinnedBalanceRef:
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          enum: [account, perspective]
        id:
          type: string

    UserSettingsPayload:
      type: object
      required:
        - account_order
        - daily_update_order
        - pinned_balances
      properties:
        account_order:
          type: array
          items:
            type: string
        daily_update_order:
          type: array
          items:
            type: string
        pinned_balances:
          type: array
          items:
            $ref: '#/components/schemas/PinnedBalanceRef'

    UserSettings:
      type: object
      required:
        - id
        - user_id
        - settings
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/UserSettingsPayload'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PatchUserSettingsRequest:
      type: object
      properties:
        account_order:
          type: array
          items:
            type: string
        daily_update_order:
          type: array
          items:
            type: string
        pinned_balances:
          type: array
          items:
            $ref: '#/components/schemas/PinnedBalanceRef'

    TokenExchangeRequest:
      type: object
      required:
        - password
        - totp_code
      properties:
        password:
          type: string
          format: password
          description: The user's plaintext password to verify against the stored bcrypt hash.
          example: "P@ssw0rd123!"
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The current 6-digit TOTP code generated by the user's authenticator app.
          example: "123456"

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The signed JWT access token containing user_id, username, subscriber, and terms_approved claims.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          description: Type of authorization token.
          example: "Bearer"
        expires_in:
          type: integer
          description: Token validity duration in seconds (default 900 seconds / 15 minutes).
          example: 900

    PolicyAgreementRequest:
      type: object
      required:
        - terms_approved
        - privacy_approved
        - us_adult_consumer_confirmed
        - terms_sha256
        - privacy_sha256
      properties:
        terms_approved:
          type: boolean
          description: Confirmation that the user accepted the Terms of Use.
          example: true
        privacy_approved:
          type: boolean
          description: Confirmation that the user accepted the Privacy & Security Policy.
          example: true
        us_adult_consumer_confirmed:
          type: boolean
          description: Confirmation that the user is at least 18 years of age and a customer located in the United States.
          example: true
        terms_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hexadecimal SHA-256 checksum of the static `/terms-of-use.pdf` document presented to the user.
          example: "4906a573260b73ad9c9c5b95c7492cca669ce4354e91a7ba4383a955d85bfb80"
        privacy_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hexadecimal SHA-256 checksum of the static `/privacy-and-security-policy.pdf` document presented to the user.
          example: "a731e26873a4229a02f875965c59a4f7b5de6c029b7e24de6907ed5b9aa6a1a7"

    PolicyAgreementResponse:
      type: object
      required:
        - id
        - user_id
        - terms_sha256
        - privacy_sha256
        - terms_approved
        - privacy_approved
        - us_adult_consumer_confirmed
        - active
        - client_ip
        - agreed_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the ledger entry.
          example: "6f8a0b2c-1d3e-4f5a-9b7c-8d9e0f1a2b3c"
        user_id:
          type: string
          format: uuid
          description: User identifier associated with this ledger entry.
          example: "d3b07384-d113-4e00-9922-b06f9d453b34"
        terms_sha256:
          type: string
          description: SHA-256 digest of the Terms of Use PDF approved by the user.
          example: "4906a573260b73ad9c9c5b95c7492cca669ce4354e91a7ba4383a955d85bfb80"
        privacy_sha256:
          type: string
          description: SHA-256 digest of the Privacy & Security Policy PDF approved by the user.
          example: "a731e26873a4229a02f875965c59a4f7b5de6c029b7e24de6907ed5b9aa6a1a7"
        terms_approved:
          type: boolean
          example: true
        privacy_approved:
          type: boolean
          example: true
        us_adult_consumer_confirmed:
          type: boolean
          example: true
        active:
          type: boolean
          description: Whether this approval remains active (false when superseded by policy updates).
          example: true
        client_ip:
          type: string
          description: Client IP address captured at the time of approval.
          example: "203.0.113.10"
        agreed_at:
          type: string
          format: date-time
          description: UTC timestamp recording when the agreement was accepted.
          example: "2026-11-18T10:00:00Z"

    AccountCreationRequest:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: User-facing display name for the account in the UI. Must contain at most 4 digits (`0-9`) to prevent storing account, routing, credit card, or Social Security numbers.
          example: "Everyday Checking"
        type:
          $ref: '#/components/schemas/AccountType'
