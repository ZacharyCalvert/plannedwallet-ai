openapi: 3.2.0
info:
  title: Planned Wallet API
  version: 1.0.0
  description: |
    Backend API specification for Planned Wallet PoC.
    Supports user self-signup, JWT-based authentication, and PostgreSQL-backed financial account management.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Users
    summary: User account creation and management
    description: Endpoints for user self-signup and profile management.
  - name: Authentication
    summary: Token exchange and session handling
    description: Exchange user credentials for JWT tokens.
  - name: Accounts
    summary: Financial account management
    description: Endpoints for creating and managing financial accounts stored in PostgreSQL.
  - name: Account Access
    summary: Account sharing and permissions
    description: Endpoints for granting, viewing, and revoking user permissions on accounts per the account_access table.
  - name: Account Assets
    summary: Asset account holdings management
    description: Endpoints for managing asset holdings, quantities, and valuations within asset accounts.
  - name: Account Snapshots
    summary: Snapshot account value records
    description: Endpoints for recording, listing, updating, and deleting point-in-time valuations for snapshot accounts.
  - name: Checking Records
    summary: Checking account transaction records
    description: Endpoints for adding, editing, deleting, and viewing records for checking accounts.
  - name: Assets
    summary: Asset definition management
    description: Endpoints for creating, listing, updating, and deleting assets (e.g. btc, eth, silver, gold).
  - name: Asset Values
    summary: Asset valuation records
    description: Endpoints for adding, viewing, updating, and deleting daily valuation assignments for assets.
  - name: Perspectives
    summary: Financial perspectives
    description: Aggregated viewing windows across multiple accounts with customizable forecasting, spend, and return metrics.
  - name: Perspective Access
    summary: Perspective sharing and permissions
    description: Endpoints for sharing perspectives and managing user access levels (read, edit, admin).
  - name: Recurring Transactions
    summary: Recurring transaction automation and reminders
    description: Private user-scoped recurring transactions (negative amounts represent bills; positive amounts represent income) with schedule rules, optional account/category linking, reminders, and apply-to-account transaction generation.
  - name: Health
    summary: Service health check
    description: Smoke test and liveness endpoints.

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Service and database health check
      description: Verifies connectivity to the backing database and returns service status.
      operationId: getHealth
      responses:
        '200':
          description: Service and database are up and healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "up"
        '503':
          description: Service or database is unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "down"
                  error:
                    type: string
                    example: "database unavailable"
  /api/v1/hello:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Health
      summary: Smoke test / health check endpoint
      description: Simple health check endpoint that returns "world".
      operationId: getHello
      responses:
        '200':
          description: Service is healthy.
          content:
            text/plain:
              schema:
                type: string
                example: "world"
        '400':
          summary: Missing or invalid client ID
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/features:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Health
      summary: List active backend feature flags
      description: |
        Returns the list of feature flags currently enabled on the backend service.
        When the environment variable PW_READONLY is "true", this includes "read_only"
        and mutating endpoints (POST/PUT/PATCH/DELETE, excluding credential login) return
        503 Service Unavailable with error code READ_ONLY_MODE.
      operationId: getFeatures
      responses:
        '200':
          description: Active backend feature flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturesResponse'
        '400':
          summary: Missing or invalid client ID
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/version:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Health
      summary: Retrieve stamped binary build version metadata
      description: |
        Returns the GitHub Actions run identifier (`github_run`), UTC build timestamp
        (`build_date`), and git commit SHA (`git_sha`) embedded into the Go binary at link time.
        Sets `Cache-Control: no-store` so edge CDNs do not cache stale deployment versions.
      operationId: getVersion
      responses:
        '200':
          description: Binary build provenance metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400':
          summary: Missing or invalid client ID
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/captcha:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Security
      summary: Generate a CAPTCHA challenge
      description: Generates a new visual CAPTCHA challenge to prevent automated bot registrations. Returns a unique CAPTCHA ID and a base64-encoded PNG image data URI.
      operationId: getCaptcha
      responses:
        '200':
          summary: CAPTCHA generated
          description: CAPTCHA challenge generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaResponse'
        '400':
          summary: Missing or invalid client ID
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          summary: Generation error
          description: Internal server error generating CAPTCHA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/captcha/{captchaId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: captchaId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the CAPTCHA challenge (optionally with .png suffix).
    get:
      tags:
        - Security
      summary: Stream CAPTCHA PNG image
      description: Retrieves the rendered PNG image directly for the specified CAPTCHA challenge ID.
      operationId: getCaptchaImage
      responses:
        '200':
          summary: CAPTCHA image
          description: PNG image bytes for the challenge.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          summary: Missing or invalid client ID
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Not found
          description: CAPTCHA challenge not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Users
      summary: Register a new user
      description: |
        Creates a new user account with username, email, and password.
        The username and email are stored in a cleartext table in PostgreSQL.
        The password is salted and hashed using bcrypt before persistence.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          summary: User registered successfully
          description: User account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          summary: Validation error
          description: Invalid request payload or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          summary: User conflict
          description: Username or email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Users
      summary: Get the authenticated user's profile details
      description: |
        Retrieves the signed-in user's `id`, `username`, `email`, and `created_at` metadata.
        Sensitive enrollment fields (`totp_secret`, `totp_url`) are omitted.
      operationId: getUser
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the authenticated user to retrieve.
          schema:
            type: string
            example: "johndoe"
      responses:
        '200':
          summary: User details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          summary: Bad request
          description: Missing username path parameter or X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: Signed-in user attempted to inspect a different user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: User not found
          description: User account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Users
      summary: Delete the authenticated user account and all associated records
      description: |
        Permanently deletes the signed-in user's account and cascades deletion across all owned
        financial accounts, transaction records, reconcile reports, user-created categories,
        user-created assets/valuations, asset stores, snapshots, subscriptions, perspectives,
        recurring transactions, and shared access grants.
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the authenticated user to delete.
          schema:
            type: string
            example: "johndoe"
      responses:
        '204':
          description: User account and all owned records deleted successfully.
        '400':
          summary: Bad request
          description: Missing username path parameter or X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: Signed-in user attempted to delete a different user's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: User not found
          description: User account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}/token:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Authentication
      summary: Exchange credentials for a JWT token
      description: |
        Exchanges a username (provided in the path) and a password (provided in the request body)
        for a signed JWT access token. The submitted password is verified against the stored bcrypt hash.
      operationId: exchangePasswordForToken
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user requesting an authentication token.
          schema:
            type: string
            example: "johndoe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          summary: JWT token issued
          description: Successfully authenticated; returns the JWT access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          summary: Bad request
          description: Missing or invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: User not found
          description: No user found matching the provided username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}/token/refresh:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Authentication
      summary: Exchange an existing valid JWT for a new JWT
      description: |
        Exchanges a currently valid Bearer JWT for a freshly signed 15-minute JWT (`expires_in` seconds)
        for the authenticated user without requiring password or TOTP re-entry.
      operationId: refreshToken
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the authenticated user refreshing their token.
          schema:
            type: string
            example: "johndoe"
      responses:
        '200':
          summary: New JWT token issued
          description: Existing JWT was valid; returns a freshly signed JWT access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          summary: Bad request
          description: Missing username path parameter or X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: Authenticated token subject does not match path username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: User not found
          description: Authenticated user record no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}/policy-agreements:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Authentication
      summary: List policy agreement ledger entries for the authenticated user
      description: |
        Returns all recorded policy agreement ledger entries for the authenticated user ordered
        newest-first (`agreed_at DESC`). Permitted even when the caller's JWT carries
        `terms_approved: false` so the client can inspect approval state.
      operationId: listPolicyAgreements
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the authenticated user.
          schema:
            type: string
            example: "johndoe"
      responses:
        '200':
          summary: Policy agreement history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyAgreementResponse'
        '400':
          summary: Bad request
          description: Missing username path parameter or X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: Authenticated user attempted to inspect another user's policy ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: User not found
          description: Authenticated user record no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Authentication
      summary: Record user acceptance of Privacy Policy, Terms of Use, and 18+ US adult consumer confirmation
      description: |
        Appends an active entry to the `policy_agreements` ledger recording client IP (`client_ip`),
        timestamp (`agreed_at`), the SHA-256 digest of the Terms of Use PDF (`terms_sha256`), and the
        SHA-256 digest of the Privacy & Security Policy PDF (`privacy_sha256`).
        Requires `terms_approved`, `privacy_approved`, and `us_adult_consumer_confirmed` to all be `true`,
        and requires `terms_sha256` and `privacy_sha256` to match the server's configured `PW_TERMS` and
        `PW_PRIVACY` SHA-256 digests when policy enforcement or those environment variables are configured.
        Permitted with a valid Bearer JWT whose `terms_approved` claim is `false`.
      operationId: recordPolicyAgreement
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the authenticated user recording policy acceptance.
          schema:
            type: string
            example: "johndoe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAgreementRequest'
      responses:
        '201':
          summary: Policy agreement recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAgreementResponse'
        '400':
          summary: Validation or terms hash mismatch error
          description: Missing checkbox confirmation (`POLICY_TERMS_NOT_APPROVED`, `POLICY_PRIVACY_NOT_APPROVED`, `POLICY_US_CUSTOMER_REQUIRED`) or Terms PDF SHA-256 mismatch (`INVALID_TERMS_HASH`, `TERMS_HASH_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: Authenticated user attempted to record policy acceptance for another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: User not found
          description: Authenticated user record no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}/recover:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Authentication
      summary: Recover account credentials using a single-use 12-word recovery phrase
      description: |
        Verifies CAPTCHA (when enabled) and the user's active Argon2id-hashed 12-word recovery phrase.
        Atomically updates the user's password, issues a new TOTP authenticator secret, marks the
        consumed recovery key inactive (recording `used_at` and `used_ip`), and generates a fresh
        single-use replacement recovery phrase.
      operationId: recoverAccount
      parameters:
        - name: username
          in: path
          required: true
          description: Username of the account to recover.
          schema:
            type: string
            example: "johndoe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRecoveryRequest'
      responses:
        '200':
          summary: Credentials reset and rotated recovery credentials returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRecoveryResponse'
        '400':
          summary: Invalid CAPTCHA or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Invalid recovery credentials
          description: Returned uniformly if the user or active recovery phrase does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}/recovery-key/rotate:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Authentication
      summary: Rotate active 12-word recovery phrase while signed in
      description: |
        Requires authenticated Bearer JWT plus current password and valid 6-digit TOTP code.
        Marks existing active recovery phrases inactive and generates a fresh Argon2id-hashed phrase.
      operationId: rotateRecoveryKey
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: Username of the signed-in user rotating their recovery phrase.
          schema:
            type: string
            example: "johndoe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRecoveryKeyRequest'
      responses:
        '200':
          summary: New recovery phrase issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateRecoveryKeyResponse'
        '401':
          summary: Unauthorized or invalid password/TOTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: Authenticated user attempted to rotate another user's recovery phrase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}/settings:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: username
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get premium user viewing settings
      description: Retrieves the authenticated premium user's viewing preferences (`account_order`, `daily_update_order`, `pinned_balances`). Returns `403 PREMIUM_REQUIRED` for basic users.
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Premium user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '403':
          summary: Forbidden or premium subscription required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Partially update premium user viewing settings
      description: Partially updates one or more viewing preference fields (`account_order`, `daily_update_order`, `pinned_balances`) for an authenticated premium user. Returns `403 PREMIUM_REQUIRED` for basic users.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserSettingsRequest'
      responses:
        '200':
          summary: Updated premium user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          summary: Invalid settings payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden or premium subscription required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Accounts
      summary: Create a financial account
      description: |
        Creates a new financial account of a specified type with a user-facing name and description.
        Requires a valid JWT Bearer token in the `Authorization` header.
        Account data is persisted in the PostgreSQL database and associated with the authenticated user.
      operationId: createAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreationRequest'
      responses:
        '201':
          summary: Account created
          description: Account created successfully in PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Invalid account type, missing name/description, or name/description containing 5 or more digits (`PROHIBITED_SENSITIVE_DIGITS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Accounts
      summary: List financial accounts
      description: |
        Retrieves all financial accounts accessible to the authenticated user (owned or granted access).
        Requires a valid JWT Bearer token in the `Authorization` header.
      operationId: listAccounts
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Accounts retrieved successfully
          description: Returns an array of financial accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the financial account.
        schema:
          type: string
          format: uuid
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"

    get:
      tags:
        - Accounts
      summary: Get a financial account
      description: Retrieves a specific financial account by its unique ID.
      operationId: getAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Account details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Accounts
      summary: Update account name and/or description
      description: |
        Partially updates an existing financial account's `name` and/or `description`.
        At least one of `name` or `description` must be provided. Immutable account attributes
        (`type`, `admin_id`, `id`) and unknown fields are rejected with `400 Bad Request`.
        Requires `edit` or `admin` access.
      operationId: patchAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          summary: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Missing patch fields, invalid/oversized name or description, 5 or more digits in name/description (`PROHIBITED_SENSITIVE_DIGITS`), disallowed fields, or missing X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: User has read-only access and cannot modify this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Accounts
      summary: Delete a financial account
      description: |
        Permanently deletes a financial account and cascades deletion to all associated records,
        holdings, snapshots, and perspective links. Enforces that only the creator (admin_id) can delete it.
      operationId: deleteAccount
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account deleted successfully.
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: Only the account creator can delete the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

