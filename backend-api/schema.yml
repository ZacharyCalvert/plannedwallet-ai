    FeaturesResponse:
      type: object
      required:
        - features
      properties:
        features:
          type: array
          items:
            type: string

    VersionResponse:
      type: object
      required:
        - github_run
        - build_date
        - git_sha
        - tag
      properties:
        github_run:
          type: string
          description: GitHub Actions run identifier or "local" when built outside CI.
          example: "42-1234567890"
        build_date:
          type: string
          description: UTC ISO-8601 build timestamp stamped at compile time.
          example: "2026-11-18T19:00:00Z"
        git_sha:
          type: string
          description: Full Git commit SHA stamped at compile time.
          example: "0123456789abcdef0123456789abcdef01234567"
        tag:
          type: string
          description: Git tag name stamped at compile time, or "untagged" when not built from a tag.
          example: "v1.2.0"
          example: ["read_only"]

    RecurringSchedule:
      type: object
      required:
        - type
        - scope
      properties:
        type:
          type: string
          enum: [weekday, day_of_period, nth_weekday, month_day, first_fifteenth, fifteenth_last]
          example: "nth_weekday"
        scope:
          type: string
          enum: [week, bi-monthly, month, year]
          example: "month"
        nth:
          type: integer
          nullable: true
          description: Occurrence index (1..5 or -1 for last in month; 1..53 or -1 for last in year).
          example: 3
        weekday:
          type: string
          enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
          example: "thursday"
        day:
          type: integer
          nullable: true
          description: Day of month (1..31) or day of year (1..366).
        month:
          type: integer
          nullable: true
          description: Month number (1..12) for yearly schedules.

    RecurringTransactionRequest:
      type: object
      required:
        - amount
        - frequency
        - entity
      properties:
        account_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          format: double
          description: Non-zero amount (negative for bills, positive for income).
          example: -125.50
        last_date_applied:
          type: string
          format: date
          nullable: true
          example: "2026-10-15"
        frequency:
          type: string
          enum: [weekly, bi-monthly, monthly, yearly]
          example: "monthly"
        interval:
          type: integer
          minimum: 1
          default: 1
          description: Recurrence multiplier applied to frequency (e.g., interval=6 with frequency=monthly represents every 6 months).
          example: 6
        schedule:
          allOf:
            - $ref: '#/components/schemas/RecurringSchedule'
          nullable: true
        name:
          type: string
          maxLength: 19
          description: Optional short display name under 20 characters for rendering in the bills or income list.
          example: "Electric"
        entity:
          type: string
          maxLength: 255
          description: Payee (for bills) or payer/source (for income).
          example: "Electric Utility"
        description:
          type: string
          maxLength: 500
          example: "Monthly electricity service"
        reminder:
          type: boolean
          default: false

    RecurringTransactionResponse:
      type: object
      required:
        - id
        - user_id
        - amount
        - frequency
        - interval
        - name
        - entity
        - description
        - reminder
        - due_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          format: double
        last_date_applied:
          type: string
          format: date
          nullable: true
        frequency:
          type: string
          enum: [weekly, bi-monthly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
        schedule:
          allOf:
            - $ref: '#/components/schemas/RecurringSchedule'
          nullable: true
        name:
          type: string
          maxLength: 19
        entity:
          type: string
        description:
          type: string
        reminder:
          type: boolean
        next_due_date:
          type: string
          format: date
          nullable: true
        due_status:
          type: string
          enum: [overdue, upcoming, scheduled, unscheduled]
        days_until_due:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecurringTransactionApplyRequest:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        date_cleared:
          type: string
          format: date
          nullable: true

