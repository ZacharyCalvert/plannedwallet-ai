openapi: 3.2.0
info:
  title: Planned Wallet API
  version: 1.0.0
  description: |
    Backend API specification for Planned Wallet PoC.
    Supports user self-signup, JWT-based authentication, and PostgreSQL-backed financial account management.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Users
    summary: User account creation and management
    description: Endpoints for user self-signup and profile management.
  - name: Authentication
    summary: Token exchange and session handling
    description: Exchange user credentials for JWT tokens.
  - name: Accounts
    summary: Financial account management
    description: Endpoints for creating and managing financial accounts stored in PostgreSQL.
  - name: Checking Records
    summary: Checking account transaction records
    description: Endpoints for adding, editing, deleting, and viewing records for checking accounts.
  - name: Health
    summary: Service health check
    description: Smoke test and liveness endpoints.

paths:
  /api/v1/hello:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Health
      summary: Smoke test / health check endpoint
      description: Simple health check endpoint that returns "world".
      operationId: getHello
      responses:
        '200':
          description: Service is healthy.
          content:
            text/plain:
              schema:
                type: string
                example: "world"
        '400':
          summary: Missing or invalid client ID
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Users
      summary: Register a new user
      description: |
        Creates a new user account with username, email, and password.
        The username and email are stored in a cleartext table in PostgreSQL.
        The password is salted and hashed using bcrypt before persistence.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          summary: User registered successfully
          description: User account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          summary: Validation error
          description: Invalid request payload or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          summary: User conflict
          description: Username or email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}/token:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Authentication
      summary: Exchange credentials for a JWT token
      description: |
        Exchanges a username (provided in the path) and a password (provided in the request body)
        for a signed JWT access token. The submitted password is verified against the stored bcrypt hash.
      operationId: exchangeToken
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user requesting an authentication token.
          schema:
            type: string
            example: "johndoe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          summary: JWT token issued
          description: Successfully authenticated; returns the JWT access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          summary: Bad request
          description: Missing or invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: User not found
          description: No user found matching the provided username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Accounts
      summary: Create a financial account
      description: |
        Creates a new financial account of a specified type with a user-facing name and description.
        Requires a valid JWT Bearer token in the `Authorization` header.
        Account data is persisted in the PostgreSQL database and associated with the authenticated user.
      operationId: createAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreationRequest'
      responses:
        '201':
          summary: Account created
          description: Account created successfully in PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Invalid account type, missing name, or missing description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Accounts
      summary: List financial accounts
      description: |
        Retrieves all financial accounts accessible to the authenticated user (owned or granted access).
        Requires a valid JWT Bearer token in the `Authorization` header.
      operationId: listAccounts
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Accounts retrieved successfully
          description: Returns an array of financial accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the financial account.
        schema:
          type: string
          format: uuid
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"

    get:
      tags:
        - Accounts
      summary: Get a financial account
      description: Retrieves a specific financial account by its unique ID.
      operationId: getAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Account details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/checking-records:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the checking account.
        schema:
          type: string
          format: uuid
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"

    post:
      tags:
        - Checking Records
      summary: Add a checking account record
      description: |
        Creates a new transaction record for a checking account with value, date sent, optional date cleared,
        counterparty entity, and description.
        Requires a valid JWT Bearer token in the `Authorization` header.
      operationId: createCheckingRecord
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckingRecordCreateRequest'
      responses:
        '201':
          summary: Checking record created
          description: Checking record successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Invalid transaction values, date formats, or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          description: No checking account found matching the provided accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Checking Records
      summary: List checking account records
      description: |
        Retrieves records for the specified checking account, with optional filtering by clearance status and date range.
        Requires a valid JWT Bearer token.
      operationId: listCheckingRecords
      security:
        - BearerAuth: []
      parameters:
        - name: cleared
          in: query
          required: false
          description: Filter records by cleared status (true for cleared, false for pending).
          schema:
            type: boolean
            example: false
        - name: start_date
          in: query
          required: false
          description: Filter records with date_sent on or after this date (inclusive).
          schema:
            type: string
            format: date
            example: "2026-11-01"
        - name: end_date
          in: query
          required: false
          description: Filter records with date_sent on or before this date (inclusive).
          schema:
            type: string
            format: date
            example: "2026-11-30"
      responses:
        '200':
          summary: List of checking records
          description: Returns an array of checking account records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          description: No checking account found matching the provided accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/checking-records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the checking account.
        schema:
          type: string
          format: uuid
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
      - name: recordId
        in: path
        required: true
        description: The unique identifier of the checking record.
        schema:
          type: string
          format: uuid
          example: "8f7b3a42-9a3b-48d0-8f92-23c2a6be8e14"

    get:
      tags:
        - Checking Records
      summary: Get a checking record
      description: Retrieves a specific checking record by its ID.
      operationId: getCheckingRecord
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Checking record details
          description: Successfully retrieved checking record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Record not found
          description: Record or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Checking Records
      summary: Update a checking record (full update)
      description: |
        Replaces all mutable fields of an existing checking record.
        Requires a valid JWT Bearer token.
      operationId: updateCheckingRecord
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckingRecordUpdateRequest'
      responses:
        '200':
          summary: Checking record updated
          description: Record updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Record not found
          description: Record or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Checking Records
      summary: Partially update a checking record
      description: |
        Partially updates fields of an existing checking record.
        Useful for setting `date_cleared` when the bank clears the transaction.
      operationId: patchCheckingRecord
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckingRecordPatchRequest'
      responses:
        '200':
          summary: Checking record updated
          description: Record updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Record not found
          description: Record or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Checking Records
      summary: Delete a checking record
      description: |
        Deletes a specific checking record.
        Requires a valid JWT Bearer token.
      operationId: deleteCheckingRecord
      security:
        - BearerAuth: []
      responses:
        '204':
          summary: Record deleted
          description: Record successfully deleted.
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Record not found
          description: Record or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authenticate using a JWT issued by POST `/api/v1/users/{username}/token`.
        Provide the token in the HTTP `Authorization` header with the format: `Bearer <token>`.

  parameters:
    XClientId:
      name: X-Client-ID
      in: header
      required: true
      description: Identifier of the client application making the request, used for debugging and caller identification purposes.
      schema:
        type: string
        example: "nextjs-static"

  schemas:
    AccountType:
      type: string
      description: The type of financial account.
      enum:
        - checking
        - savings
        - credit card
        - assets
        - snapshot
      example: "checking"

    UserRegistrationRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Unique username stored in plaintext in the users table.
          example: "johndoe"
        email:
          type: string
          format: email
          maxLength: 255
          description: User's contact email stored in plaintext in the users table.
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          minLength: 10
          writeOnly: true
          description: Plaintext password provided during registration; hashed with bcrypt and salted before persistence. Must be at least 10 characters and contain at least 1 uppercase letter, 1 lowercase letter, 1 number, and 1 non-alphanumeric special character.
          example: "P@ssw0rd123!"

    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user.
          example: "d3b07384-d113-4e00-9922-b06f9d453b34"
        username:
          type: string
          description: Unique username stored in plaintext.
          example: "johndoe"
        email:
          type: string
          format: email
          description: User email stored in plaintext.
          example: "john.doe@example.com"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the user was created.
          example: "2026-11-09T19:00:00Z"
        totp_secret:
          type: string
          description: Base32-encoded TOTP secret key for two-factor authentication setup.
          example: "JBSWY3DPEHPK3PXP"
        totp_url:
          type: string
          description: Standard otpauth URL for generating authenticator QR codes.
          example: "otpauth://totp/PlannedWallet:johndoe?secret=JBSWY3DPEHPK3PXP&issuer=PlannedWallet"

    TokenExchangeRequest:
      type: object
      required:
        - password
        - totp_code
      properties:
        password:
          type: string
          format: password
          description: The user's plaintext password to verify against the stored bcrypt hash.
          example: "P@ssw0rd123!"
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The current 6-digit TOTP code generated by the user's authenticator app.
          example: "123456"

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The signed JWT access token.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          description: Type of authorization token.
          example: "Bearer"
        expires_in:
          type: integer
          description: Token validity duration in seconds.
          example: 3600

    AccountCreationRequest:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: User-facing display name for the account in the UI.
          example: "Everyday Checking"
        type:
          $ref: '#/components/schemas/AccountType'
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable description or label for the account.
          example: "Primary Everyday Checking Account"

    AccountResponse:
      type: object
      required:
        - id
        - admin_id
        - name
        - type
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the account.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        admin_id:
          type: string
          format: uuid
          description: Identifier of the admin/owner user for this account.
          example: "d3b07384-d113-4e00-9922-b06f9d453b34"
        name:
          type: string
          description: User-facing display name for the account in the UI.
          example: "Everyday Checking"
        type:
          $ref: '#/components/schemas/AccountType'
        description:
          type: string
          description: Human-readable description of the account.
          example: "Primary Everyday Checking Account"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the account was created.
          example: "2026-11-09T19:15:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the account was last updated.
          example: "2026-11-09T19:15:00Z"

    AccessLevel:
      type: string
      description: Level of access granted to a user for an account.
      enum:
        - read
        - edit
        - admin
      example: "admin"

    AccountAccessResponse:
      type: object
      required:
        - id
        - account_id
        - user_id
        - access_level
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the access grant record.
          example: "b1f8e21a-4d2b-4e12-85a2-c1f034567890"
        account_id:
          type: string
          format: uuid
          description: Identifier of the account.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        user_id:
          type: string
          format: uuid
          description: Identifier of the user granted access.
          example: "d3b07384-d113-4e00-9922-b06f9d453b34"
        access_level:
          $ref: '#/components/schemas/AccessLevel'
        created_at:
          type: string
          format: date-time
          description: Timestamp when access was granted.
          example: "2026-11-10T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when access was last modified.
          example: "2026-11-10T09:00:00Z"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: High-level error classification or code.
          example: "INVALID_CREDENTIALS"
        message:
          type: string
          description: Detailed human-readable error description.
          example: "The password provided does not match our records."
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred.
          example: "2026-11-09T19:15:00Z"

    CheckingRecordCreateRequest:
      type: object
      required:
        - value
        - date_sent
        - entity
      properties:
        value:
          type: number
          format: double
          description: Amount of the transaction (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: The date the check or payment was issued or sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: The date the bank accepted or logged the transaction. Omit or pass null if pending.
          example: "2026-11-12"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Who the money was spent with, check written to, or payment received from.
          example: "Target"
        description:
          type: string
          maxLength: 500
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"

    CheckingRecordUpdateRequest:
      type: object
      required:
        - value
        - date_sent
        - entity
      properties:
        value:
          type: number
          format: double
          description: Amount of the transaction (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: The date the check or payment was issued or sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: The date the bank accepted or logged the transaction. Set to null if uncleared.
          example: "2026-11-12"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Who the money was spent with, check written to, or payment received from.
          example: "Target"
        description:
          type: string
          maxLength: 500
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"

    CheckingRecordPatchRequest:
      type: object
      description: Fields to update on the checking record. Any omitted fields remain unchanged.
      properties:
        value:
          type: number
          format: double
          description: Updated transaction amount.
          example: -125.50
        date_sent:
          type: string
          format: date
          description: Updated date sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: Set to mark the transaction as cleared by the bank, or null to revert to pending.
          example: "2026-11-12"
        entity:
          type: string
          minLength: 1
          maxLength: 255
          description: Updated counterparty entity.
          example: "Target"
        description:
          type: string
          maxLength: 500
          description: Updated memo or note.
          example: "Weekly groceries and household supplies"

    CheckingRecordResponse:
      type: object
      required:
        - id
        - account_id
        - value
        - date_sent
        - entity
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the checking record.
          example: "8f7b3a42-9a3b-48d0-8f92-23c2a6be8e14"
        account_id:
          type: string
          format: uuid
          description: Identifier of the checking account this record belongs to.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        value:
          type: number
          format: double
          description: Transaction amount (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: Date the check was written or payment was sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: Date the bank cleared or logged the transaction. Null if pending.
          example: "2026-11-12"
        entity:
          type: string
          description: Who the transaction was with (payee, merchant, or payer).
          example: "Target"
        description:
          type: string
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
          example: "2026-11-09T19:25:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was last updated.
          example: "2026-11-09T19:25:00Z"
