          example: "8f7b3a42-9a3b-48d0-8f92-23c2a6be8e14"
        account_id:
          type: string
          format: uuid
          description: Identifier of the checking account this record belongs to.
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
        category_id:
          type: string
          format: uuid
          nullable: true
          description: Optional category UUID assigned to this transaction, or null if uncategorized.
          example: "00000000-0000-4000-8000-000000000003"
        reconcile_report_id:
          type: string
          format: uuid
          nullable: true
          description: Reconcile report UUID if this transaction has been reconciled, or null otherwise.
          example: null
        value:
          type: number
          format: double
          description: Transaction amount (negative for payments/debits/checks, positive for deposits/credits).
          example: -125.50
        date_sent:
          type: string
          format: date
          description: Date the check was written or payment was sent.
          example: "2026-11-09"
        date_cleared:
          type: string
          format: date
          nullable: true
          description: Date the bank cleared or logged the transaction. Null if pending.
          example: "2026-11-12"
        entity:
          type: string
          description: Who the transaction was with (payee, merchant, or payer).
          example: "Corner Grocery"
        description:
          type: string
          description: Human-readable note or memo describing the transaction.
          example: "Weekly groceries and household supplies"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
          example: "2026-11-09T19:25:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was last updated.
