openapi: 3.2.0
info:
  title: Planned Wallet API
  version: 1.0.0
  description: |
    Backend API specification for Planned Wallet PoC.
    Supports user self-signup, JWT-based authentication, and PostgreSQL-backed financial account management.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Users
    summary: User account creation and management
    description: Endpoints for user self-signup and profile management.
  - name: Authentication
    summary: Token exchange and session handling
    description: Exchange user credentials for JWT tokens.
  - name: Accounts
    summary: Financial account management
    description: Endpoints for creating and managing financial accounts stored in PostgreSQL.
  - name: Account Access
    summary: Account sharing and permissions
    description: Endpoints for granting, viewing, and revoking user permissions on accounts per the account_access table.
  - name: Account Assets
    summary: Asset account holdings management
    description: Endpoints for managing asset holdings, quantities, and valuations within asset accounts.
  - name: Account Snapshots
    summary: Snapshot account value records
    description: Endpoints for recording, listing, updating, and deleting point-in-time valuations for snapshot accounts.
  - name: Checking Records
    summary: Checking account transaction records
    description: Endpoints for adding, editing, deleting, and viewing records for checking accounts.
  - name: Assets
    summary: Asset definition management
    description: Endpoints for creating, listing, updating, and deleting assets (e.g. btc, eth, silver, gold).
  - name: Asset Values
    summary: Asset valuation records
    description: Endpoints for adding, viewing, updating, and deleting daily valuation assignments for assets.
  - name: Health
    summary: Service health check
    description: Smoke test and liveness endpoints.

paths:
  /api/v1/hello:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    get:
      tags:
        - Health
      summary: Smoke test / health check endpoint
      description: Simple health check endpoint that returns "world".
      operationId: getHello
      responses:
        '200':
          description: Service is healthy.
          content:
            text/plain:
              schema:
                type: string
                example: "world"
        '400':
          summary: Missing or invalid client ID
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Users
      summary: Register a new user
      description: |
        Creates a new user account with username, email, and password.
        The username and email are stored in a cleartext table in PostgreSQL.
        The password is salted and hashed using bcrypt before persistence.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          summary: User registered successfully
          description: User account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          summary: Validation error
          description: Invalid request payload or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          summary: User conflict
          description: Username or email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}/token:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Authentication
      summary: Exchange credentials for a JWT token
      description: |
        Exchanges a username (provided in the path) and a password (provided in the request body)
        for a signed JWT access token. The submitted password is verified against the stored bcrypt hash.
      operationId: exchangeToken
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user requesting an authentication token.
          schema:
            type: string
            example: "johndoe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          summary: JWT token issued
          description: Successfully authenticated; returns the JWT access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          summary: Bad request
          description: Missing or invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: User not found
          description: No user found matching the provided username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts:
    parameters:
      - $ref: '#/components/parameters/XClientId'
    post:
      tags:
        - Accounts
      summary: Create a financial account
      description: |
        Creates a new financial account of a specified type with a user-facing name and description.
        Requires a valid JWT Bearer token in the `Authorization` header.
        Account data is persisted in the PostgreSQL database and associated with the authenticated user.
      operationId: createAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreationRequest'
      responses:
        '201':
          summary: Account created
          description: Account created successfully in PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Invalid account type, missing name, or missing description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Accounts
      summary: List financial accounts
      description: |
        Retrieves all financial accounts accessible to the authenticated user (owned or granted access).
        Requires a valid JWT Bearer token in the `Authorization` header.
      operationId: listAccounts
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Accounts retrieved successfully
          description: Returns an array of financial accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the financial account.
        schema:
          type: string
          format: uuid
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"

    get:
      tags:
        - Accounts
      summary: Get a financial account
      description: Retrieves a specific financial account by its unique ID.
      operationId: getAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Account details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/records:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the checking account.
        schema:
          type: string
          format: uuid
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"

    post:
      tags:
        - Checking Records
      summary: Add a checking account record
      description: |
        Creates a new transaction record for a checking account with value, date sent, optional date cleared,
        counterparty entity, and description.
        Requires a valid JWT Bearer token in the `Authorization` header.
      operationId: createCheckingRecord
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckingRecordCreateRequest'
      responses:
        '201':
          summary: Checking record created
          description: Checking record successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Invalid transaction values, date formats, or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          description: No checking account found matching the provided accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Checking Records
      summary: List checking account records
      description: |
        Retrieves records for the specified checking account, with optional filtering by clearance status and date range.
        Requires a valid JWT Bearer token.
      operationId: listCheckingRecords
      security:
        - BearerAuth: []
      parameters:
        - name: cleared
          in: query
          required: false
          description: Filter records by cleared status (true for cleared, false for pending).
          schema:
            type: boolean
            example: false
        - name: start_date
          in: query
          required: false
          description: Filter records with date_sent on or after this date (inclusive).
          schema:
            type: string
            format: date
            example: "2026-11-01"
        - name: end_date
          in: query
          required: false
          description: Filter records with date_sent on or before this date (inclusive).
          schema:
            type: string
            format: date
            example: "2026-11-30"
      responses:
        '200':
          summary: List of checking records
          description: Returns an array of checking account records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          description: No checking account found matching the provided accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the checking account.
        schema:
          type: string
          format: uuid
          example: "7e954536-4ec8-490b-9304-4b52b217d84b"
      - name: recordId
        in: path
        required: true
        description: The unique identifier of the checking record.
        schema:
          type: string
          format: uuid
          example: "8f7b3a42-9a3b-48d0-8f92-23c2a6be8e14"

    get:
      tags:
        - Checking Records
      summary: Get a checking record
      description: Retrieves a specific checking record by its ID.
      operationId: getCheckingRecord
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Checking record details
          description: Successfully retrieved checking record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Record not found
          description: Record or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Checking Records
      summary: Update a checking record (full update)
      description: |
        Replaces all mutable fields of an existing checking record.
        Requires a valid JWT Bearer token.
      operationId: updateCheckingRecord
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckingRecordUpdateRequest'
      responses:
        '200':
          summary: Checking record updated
          description: Record updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Record not found
          description: Record or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Checking Records
      summary: Partially update a checking record
      description: |
        Partially updates fields of an existing checking record.
        Useful for setting `date_cleared` when the bank clears the transaction.
      operationId: patchCheckingRecord
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckingRecordPatchRequest'
      responses:
        '200':
          summary: Checking record updated
          description: Record updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckingRecordResponse'
        '400':
          summary: Bad request
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Record not found
          description: Record or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Checking Records
      summary: Delete a checking record
      description: |
        Deletes a specific checking record.
        Requires a valid JWT Bearer token.
      operationId: deleteCheckingRecord
      security:
        - BearerAuth: []
      responses:
        '204':
          summary: Record deleted
          description: Record successfully deleted.
        '400':
          summary: Bad request
          description: Missing or invalid required X-Client-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          description: Missing, invalid, or expired JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Record not found
          description: Record or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/access:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: Unique identifier of the account.
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Account Access
      summary: Grant or update access permissions for a user
      description: |
        Allows the account admin to grant or update permissions (read, edit, admin)
        for a collaborator on the account, recorded in the account_access table.
      operationId: grantAccountAccess
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountAccessGrantRequest'
      responses:
        '200':
          summary: Access permissions granted or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccessResponse'
        '400':
          summary: Validation or client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: Only the account admin can grant access permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Not found
          description: Account or target user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/access/{userId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: Unique identifier of the account.
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        description: Unique identifier of the target user.
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Account Access
      summary: Get access permissions for a user
      description: Retrieves the permission level for a given user on the specified account.
      operationId: getAccountAccess
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Access details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccessResponse'
        '400':
          summary: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Account Access
      summary: Revoke access permissions for a user
      description: Allows the account admin to revoke another user's access to the account.
      operationId: revokeAccountAccess
      security:
        - BearerAuth: []
      responses:
        '204':
          summary: Access permissions revoked
        '400':
          summary: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/assets:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: Unique identifier of the asset account.
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Account Assets
      summary: Add an asset holding to an asset account
      description: |
        Associates an asset with an asset account with a specified positive quantity.
        Enforces access control (admin or edit required).
        Returns the holding with the latest valuation and calculated total value.
      operationId: addAccountAsset
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountAssetAddRequest'
      responses:
        '201':
          summary: Asset holding added to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAssetResponse'
        '400':
          summary: Invalid request or account type
          description: Account is not an asset account, or quantity is <= 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          description: User lacks edit/admin permission on this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account or asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          summary: Asset already added
          description: Asset already exists in this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Account Assets
      summary: List all asset holdings in an asset account
      description: |
        Returns all asset holdings with their held quantities, latest valuations,
        and calculated total values (quantity * latest_value).
      operationId: listAccountAssets
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Asset holdings retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountAssetResponse'
        '400':
          summary: Invalid account type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/assets/summary:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: Unique identifier of the asset account.
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Account Assets
      summary: Get asset account summary and aggregated worth
      description: |
        Retrieves an asset account summary, aggregating the total account worth
        computed from the latest valuations multiplied by the held quantities.
      operationId: getAssetAccountSummary
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Account summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAccountSummaryResponse'
        '400':
          summary: Invalid account type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/XClientId'
      - name: accountId
        in: path
        required: true
        description: Unique identifier of the asset account.
        schema:
          type: string
          format: uuid
      - name: assetId
        in: path
        required: true
        description: Unique identifier of the asset or holding record.
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Account Assets
      summary: Get an asset holding from an account
      description: Retrieves a specific asset holding with latest valuation and calculated total worth.
      operationId: getAccountAsset
      security:
        - BearerAuth: []
      responses:
        '200':
          summary: Asset holding retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAssetResponse'
        '400':
          summary: Invalid account type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          summary: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          summary: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          summary: Asset holding or account not found
          content:
            application/json:
              schema:
