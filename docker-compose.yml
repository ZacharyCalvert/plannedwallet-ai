services:
  postgres:
    image: postgres:16.15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plannedwallet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./${DATA_DIR:-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
      args:
        GITHUB_RUN: ${GITHUB_RUN:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: backend-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plannedwallet}
      POSTGRES_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-replace-in-production}
      PRODUCTION_ENV: ${PRODUCTION_ENV:-false}
      ENFORCE_POLICY: ${ENFORCE_POLICY:-false}
      PW_TERMS: ${PW_TERMS:-b08f3d8b1cd44544888a78ed13316c0910725944bc46808ab542e36d9b2fd84c}
      EXPECTED_ORIGIN_SECRET: ${EXPECTED_ORIGIN_SECRET:-}
      PW_READONLY: ${PW_READONLY:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-ui:
    build:
      context: ./frontend-ui
      dockerfile: Dockerfile
    container_name: frontend-ui
    restart: unless-stopped
    ports:
      - "8282:8282"
    volumes:
      - ./frontend-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api

  gateway:
    build:
      context: ./nginx-gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - ./nginx-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - frontend-ui
