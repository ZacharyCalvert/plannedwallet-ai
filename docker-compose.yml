services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plannedwallet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: backend-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plannedwallet}
      POSTGRES_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-jwt-key}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-ui:
    build:
      context: ./frontend-ui
      dockerfile: Dockerfile
    container_name: frontend-ui
    restart: unless-stopped
    ports:
      - "8282:8282"
    volumes:
      - ./frontend-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - frontend-ui
