server {
    listen 8181;
    server_name localhost;

    resolver 127.0.0.11 valid=10s;

    # Route /api and /api/* to the backend API service
    location /api {
        set $backend "http://backend-api:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Client-ID $http_x_client_id;
        proxy_set_header X-Azure-FDID $http_x_azure_fdid;
    }

    # Route all other content to the static Next.js frontend container
    location / {
        set $frontend "http://frontend-ui:8282";
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Azure-FDID $http_x_azure_fdid;

        # Disable all caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
